<title>Projet 8a</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#EBEDEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Projet 8a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EBEDEF; --surface:#FFFFFF; --surface2:#E2E6EA; --border:#CCD3D9;
  --text:#141A1F; --dim:#5B666F; --faint:#8C959D;
  --accent:#AC442A; --accent-soft:#F2DDD5; --accent-line:#D9714F;
  --ok:#2C7A58; --ok-soft:#D7ECE1; --warn:#A8731A; --danger:#B93B2C;
  --data:#1D6B70; --data2:#8A5A9B;
  --shadow:0 1px 2px rgba(20,26,31,.06),0 8px 24px rgba(20,26,31,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11151A; --surface:#191F26; --surface2:#232B34; --border:#2D3742;
    --text:#E7EDF2; --dim:#8B98A4; --faint:#6A7681;
    --accent:#E0714A; --accent-soft:#3A2018; --accent-line:#E0714A;
    --ok:#4FB88C; --ok-soft:#16301F; --warn:#D6A23F; --danger:#E4705F;
    --data:#4FB2B8; --data2:#B08CC4;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#11151A; --surface:#191F26; --surface2:#232B34; --border:#2D3742;
  --text:#E7EDF2; --dim:#8B98A4; --faint:#6A7681;
  --accent:#E0714A; --accent-soft:#3A2018; --accent-line:#E0714A;
  --ok:#4FB88C; --ok-soft:#16301F; --warn:#D6A23F; --danger:#E4705F;
  --data:#4FB2B8; --data2:#B08CC4;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:Archivo,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

#app{max-width:600px;margin:0 auto;padding:0 14px calc(84px + env(safe-area-inset-bottom))}

/* ---- header ---- */
header{position:sticky;top:0;z-index:40;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 0 8px;
  border-bottom:1px solid var(--border)}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:19px}
.brand span{color:var(--accent)}
.hmeta{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:600}
.track{height:4px;background:var(--surface2);border-radius:99px;margin-top:9px;overflow:hidden;display:flex;gap:1px}
.track i{flex:1;background:var(--border);border-radius:1px}
.track i.p{background:var(--accent-line)}
.track i.cur{background:var(--accent);box-shadow:0 0 0 1px var(--accent)}

/* ---- generic ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  margin-top:12px;overflow:hidden;box-shadow:var(--shadow)}
.card.pad{padding:16px}
h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  font-weight:700;margin:22px 0 0}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;
  background:var(--surface2);color:var(--dim)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.dot{width:6px;height:6px;border-radius:99px;background:currentColor}

/* ---- session ---- */
.shead{padding:15px 16px;display:flex;flex-direction:column;gap:8px;
  border-bottom:1px solid var(--border)}
.stitle{font-size:20px;font-weight:700;letter-spacing:-.02em;text-wrap:balance;line-height:1.2}
.srow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sgoal{font-size:13.5px;color:var(--dim);margin:0}
.blk{border-bottom:1px solid var(--border)}
.blk:last-child{border-bottom:none}
.blkh{padding:11px 16px 5px;font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between}
.ex{display:flex;gap:11px;padding:9px 16px 11px;align-items:flex-start}
.chk{flex:0 0 24px;height:24px;margin-top:1px;border:1.5px solid var(--border);border-radius:7px;
  background:var(--surface2);display:grid;place-items:center;transition:.14s}
.chk svg{width:14px;height:14px;stroke:var(--surface);stroke-width:3;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);transition:.14s}
.ex.done .chk{background:var(--ok);border-color:var(--ok)}
.ex.done .chk svg{opacity:1;transform:scale(1)}
.ex.done .exl{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--faint)}
.exb{flex:1;min-width:0}
.exl{font-weight:600;font-size:14.5px;line-height:1.35;display:block;text-align:left}
.exd{font-size:13px;color:var(--dim);margin-top:4px;display:none;text-align:left;
  border-left:2px solid var(--accent-line);padding-left:10px}
.ex.open .exd{display:block}
.exi{font-size:12.5px;color:var(--accent);font-weight:600;margin-top:3px;display:block;text-align:left}
.inl{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.inl input{width:70px;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:6px 8px;font-family:'JetBrains Mono',monospace;font-size:13px}
.inl input:focus{outline:2px solid var(--accent-line);outline-offset:-1px}
.unit{align-self:center;font-size:12px;color:var(--faint)}
.mini{padding:6px 10px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);
  font-size:12px;font-weight:600}
.mini:active{background:var(--accent-soft)}

.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--accent);
  color:#fff;font-weight:700;font-size:15px;letter-spacing:.01em;margin-top:12px}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn.done{background:var(--ok)}

/* ---- fields ---- */
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:12px 16px;border-bottom:1px solid var(--border)}
.field:last-child{border-bottom:none}
.field label{font-size:14px;font-weight:600}
.field .sub{font-size:12.5px;color:var(--dim);font-weight:400;margin-top:2px}
.field input,.field select{background:var(--surface2);border:1px solid var(--border);
  border-radius:9px;padding:8px 10px;font-family:'JetBrains Mono',monospace;font-size:14px;
  width:120px;text-align:right}
.slider{width:100%;accent-color:var(--accent);margin-top:6px}

/* ---- week ---- */
.day{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);align-items:flex-start}
.day:last-child{border-bottom:none}
.day.today{background:var(--accent-soft)}
.dnum{flex:0 0 42px;text-align:center}
.dnum b{display:block;font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;line-height:1}
.dnum s{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);text-decoration:none;margin-top:3px;font-weight:600}
.dbody{flex:1;min-width:0}
.dbody b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.dbody span{font-size:12.5px;color:var(--dim)}
.stripe{flex:0 0 3px;align-self:stretch;border-radius:99px;background:var(--border)}

/* ---- charts ---- */
canvas{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;padding:0 16px 14px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border)}
.stat{background:var(--surface);padding:14px 10px;text-align:center}
.stat b{display:block;font-family:'JetBrains Mono',monospace;font-size:23px;font-weight:700;letter-spacing:-.03em}
.stat s{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--dim);text-decoration:none;margin-top:4px;font-weight:600}

/* ---- nav ---- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--border);display:flex;
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  backdrop-filter:blur(12px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;
  font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
nav button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}

/* ---- timer ---- */
#timer{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px}
#timer.on{display:flex}
#tphase{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--dim)}
#tbig{font-family:'JetBrains Mono',monospace;font-size:clamp(80px,26vw,132px);font-weight:700;
  letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
#tsub{font-size:14px;color:var(--dim);font-family:'JetBrains Mono',monospace}
#timer.work #tbig{color:var(--accent)}
#timer.rest #tbig{color:var(--data)}
.tbtns{display:flex;gap:10px;margin-top:26px;width:100%;max-width:330px}
.tbtns button{flex:1;padding:15px;border-radius:12px;background:var(--surface2);
  border:1px solid var(--border);font-weight:700;font-size:14px}
.ring{width:min(74vw,290px);aspect-ratio:1;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .bgc{stroke:var(--surface2)}
.ring .fg{stroke:var(--accent);transition:stroke-dashoffset .25s linear}
#timer.rest .ring .fg{stroke:var(--data)}
.tin{display:grid;place-items:center;gap:2px}

.note{font-size:13px;color:var(--dim);padding:0 16px 14px;margin:0}
.warnbox{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:12px;
  padding:13px 15px;margin-top:12px;font-size:13.5px;line-height:1.5}
.warnbox b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin-bottom:5px}
.phasebox{padding:14px 16px}
.phasebox h3{margin:0 0 4px;font-size:16px;font-weight:700;letter-spacing:-.01em}
.phasebox p{margin:0;font-size:13.5px;color:var(--dim)}
.pill{display:flex;gap:6px;padding:0 0 4px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
.pill::-webkit-scrollbar{display:none}
.pill button{flex:0 0 auto;padding:7px 13px;border-radius:99px;border:1px solid var(--border);
  background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap}
.pill button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent-line);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <header>
    <div class="hrow">
      <div class="brand">Projet <span>8a</span></div>
      <div class="hmeta" id="hmeta"></div>
    </div>
    <div class="track" id="htrack"></div>
  </header>
  <main id="view"></main>
</div>

<nav id="nav"></nav>

<div id="timer">
  <div id="tphase">Repos</div>
  <div class="ring">
    <svg viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="46"></circle>
    <circle class="fg" cx="50" cy="50" r="46" id="tring"></circle></svg>
    <div class="tin"><div id="tbig">00</div><div id="tsub"></div></div>
  </div>
  <div class="tbtns">
    <button id="tskip">Passer</button>
    <button id="tstop">Fermer</button>
  </div>
</div>
<script>
/* ============ DONNÉES PROGRAMME ============ */
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const DSH=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

const NW=9;
const TBA={d:'2026-11-14',name:'Team Boulder Arena 5',lieu:'Climbing District Buttes-Chaumont, Paris'};
const PHASES=[
 {n:1,from:1,to:2,name:'Remise en charge',goal:"Deux semaines pour remonter la charge sur les doigts sans rien casser et rouvrir les styles que le dévers ne travaille jamais. Tu ne cherches pas à performer, tu prépares le bloc de force qui suit."},
 {n:2,from:3,to:5,name:'Force maximale',goal:"Trois semaines de charges lourdes au Tindeq, priorité absolue sur les doigts, deux séances de salle par semaine. C'est le seul moment du cycle où tu peux encore gagner des kilos, et c'est court : chaque séance du lundi compte double."},
 {n:3,from:6,to:7,name:'Bascule compétition',goal:"Les doigts passent en entretien, la salle prend le relais. Deux simulations complètes au format TBA, samedi 24 octobre à Paris et samedi 31 octobre chez toi. Ce que ces deux journées révèlent vaut plus que n'importe quelle séance de force du mois précédent."},
 {n:4,from:8,to:9,name:'Affûtage et compétition',goal:"Volume divisé par deux, plus rien de lourd, aucun nouveau stimulus. Tout ce que tu peux encore gagner ici, c'est de la fraîcheur. Samedi 14 novembre, Buttes-Chaumont."}
];
const phaseOf=w=>PHASES.find(p=>w>=p.from&&w<=p.to)||PHASES[3];
const isDeload=w=>w===8;
const CONTEST={d:'2026-10-04',w:3};
const isContestDay=(w,d)=>d===6&&w===CONTEST.w;
const isSimDay=(w,d)=>d===5&&(w===6||w===7);
const isTbaDay=(w,d)=>d===5&&w===NW;

/* ---- briques réutilisables ---- */
const WU_SALLE={name:'Échauffement (20 min, non négociable)',items:[
 {id:'wu1',l:'Cardio léger 5 min',d:"Corde à sauter, montées de genoux, rameur. Tu dois avoir chaud et légèrement transpirer. Avec ton genou, évite les sauts répétés au début : privilégie le rameur ou le vélo."},
 {id:'wu2',l:'Mobilité épaules, poignets, hanches 4 min',d:"Dislocations au bâton ou à la serviette, cercles de poignets, 90/90 hanche, squat profond tenu 30 s."},
 {id:'wu3',l:'Élastique doigts, 2x20 flexion/extension',d:"Ça amène du sang dans les poulies et réveille les extenseurs. C'est cet exercice qui fait la différence sur le long terme post-blessure."},
 {id:'wu4',l:'Progression sur bacs et réglettes larges',d:"Sur le mur : cinq mouvements sur gros bacs, puis cinq sur prises moyennes, puis cinq sur réglettes larges. Tu n'as pas ton Tindeq en salle, c'est le mur qui sert d'échauffement progressif. Si ça tire dans une poulie, tu prolonges au lieu de continuer."},
 {id:'wu5',l:'6 blocs faciles',d:"Du 6a au 6c, concentration exclusive sur les pieds et le placement du bassin. Aucun mouvement violent, aucune réception sautée."}
]};
const MOB_QUOT={name:'Mobilité quotidienne (12 min)',items:[
 {id:'m1',l:'Respiration + cat-cow, 1 min',d:"Cinq respirations lentes puis dix cycles dos rond, dos creux. Ça réveille la charnière lombaire avant tout le reste."},
 {id:'m2',l:'90/90 hanche avec lifts, 2x30s par côté',d:"Assis, une jambe devant à 90°, l'autre sur le côté à 90°. Tu décolles activement le genou du sol quelques secondes. C'est la rotation de hanche qui te manque pour les drop knees."},
 {id:'m3',l:'Pigeon actif, 2x45s par côté',d:"Tu ne restes pas passif : tu pousses le tibia dans le sol 5 s, tu relâches 10 s, tu répètes. Beaucoup plus efficace que tenir la position sans rien faire."},
 {id:'m4',l:'Jefferson curl à vide, 3x5 lents',d:"Debout, tu déroules vertèbre par vertèbre vers le sol, puis tu remontes de la même façon. 10 secondes par répétition. Sans charge, uniquement l'amplitude."},
 {id:'m5',l:'Dislocations épaules au bâton, 2x10',d:"Prise large sur un balai, bras tendus, tu passes de l'avant vers l'arrière. Tu resserres la prise au fil des semaines."},
 {id:'m6',l:'Suspension passive à la barre, 2x30s',d:"Épaules relâchées puis actives. Bon pour les épaules et pour décomprimer le dos."},
 {id:'m7',l:'Squat profond tenu, 60s',d:"Talons au sol, coudes qui poussent les genoux vers l'extérieur. Si le genou tire à l'avant, réduis la profondeur, c'est le SFP qui parle."}
]};
const MOB_ECART={name:'Mobilité écart et hanche (15 min, 2 fois par semaine)',items:[
 {id:'e1',l:'Grenouille PAILs/RAILs, 2 cycles',d:"À quatre pattes genoux écartés. Tu tiens la position basse 2 min, puis tu pousses les genoux dans le sol à 30 % pendant 10 s (PAILs), puis tu tires activement les genoux vers l'intérieur sans bouger 10 s (RAILs), puis tu regagnes de l'amplitude. C'est ce protocole qui débloque vraiment une hanche raide."},
 {id:'e2',l:'Écart latéral tenu, 3x60s',d:"Appuis sur les mains, tu descends jusqu'au seuil de tension supportable. Respire, ne rebondis jamais."},
 {id:'e3',l:'Copenhague adducteurs, 3x20s par côté',d:"Sur le côté, jambe du dessus posée sur une chaise, tu soulèves le bassin. Version genou fléchi pour commencer. Renforce l'écart au lieu de juste l'étirer."},
 {id:'e4',l:'Rotation externe de hanche debout, 2x10 par côté',d:"Debout appui sur un mur, tu montes le genou et tu ouvres la hanche vers l'extérieur, lentement. C'est le mouvement du drop knee."},
 {id:'e5',l:'Dorsiflexion cheville au mur, 3x10 par côté',d:"Genou vers le mur sans décoller le talon. Directement utile pour tes pieds en escalade et pour le genou."}
]};

/* ---- rééducation genou : 6 semaines SFP ---- */
const KNEE_MOB={name:'Mobilité genou et pied (8 min, tous les jours)',items:[
 {id:'k1',l:'Étirement avant de hanche (psoas), 2x30s par côté',d:"Fente, genou arrière au sol sur une serviette. Bassin vers l'avant, dos droit, ne cambre pas."},
 {id:'k2',l:'Rotation douce de hanche, 2x30s par côté',d:"Allongé sur le dos, genou vers la poitrine puis ouverture vers l'extérieur. Lent, sans forcer."},
 {id:'k3',l:'Dorsiflexion au mur, 10 par côté',d:"Pied à 10 cm du mur, genou vers le mur sans décoller le talon."},
 {id:'k4',l:'Étirement du mollet, 2x30s par côté',d:"Mains au mur, jambe arrière tendue, talon au sol, pieds droits."},
 {id:'k5',l:'Serviette avec les orteils, 1 à 2 min par pied',d:"Assis, tu ramasses une serviette avec les orteils seuls. Chiant mais ça reconstruit la voûte plantaire."}
]};
const KNEE_RULES="Douleur jusqu'à 3-4/10 pendant l'exercice : acceptable. Au-delà, tu arrêtes. Le lendemain le genou doit être revenu à son état habituel, sinon tu fais une pause d'un jour et tu reprends au niveau de la semaine précédente. Gonflement, blocage ou genou qui lâche : tu arrêtes tout et tu appelles ton kiné.";

const KNEE_REEDUC=[
 {t:'Rééducation genou S1 : premiers pas',note:"Objectif : découvrir les exercices et voir comment le genou réagit. Ne cherche pas à en faire plus.",ex:[
  {id:'r1',l:'Contraction genou tendu, 3x5 de 30s',d:"Assis, jambe tendue sur une chaise. Tu serres le devant de la cuisse comme pour écraser un coussin sous le genou, sans bouger la jambe. La cuisse doit durcir, pas de douleur vive."},
  {id:'r2',l:'Pont fessier, 3x10',d:"Sur le dos, genoux pliés, talons au sol, avant-pied vers le ciel. Tu serres les fesses et tu montes le bassin. C'est la fesse qui pousse, pas le bas du dos."},
  {id:'r3',l:'Mini-squat contre un mur, 3x10',d:"Dos au mur, pieds légèrement avancés. Descente très douce sur petite amplitude. Les genoux restent dans l'axe des pieds."}]},
 {t:'Rééducation genou S2 : montée en charge',note:"On ajoute les mollets et on complique le pont fessier.",ex:[
  {id:'r1',l:'Pont fessier pied surélevé, 3x8 par jambe',d:"Un pied sur une marche ou un livre épais. Si c'est trop dur, tu restes au pont fessier classique."},
  {id:'r2',l:'Clamshell élastique, 3x12 par côté',d:"Sur le côté, genoux pliés, élastique AU-DESSUS du genou (pas en dessous). Ouverture du genou du dessus sans bouger le bassin. Le mouvement vient de la hanche, pas du dos qui roule en arrière."},
  {id:'r3',l:'Mini-squat au mur un peu plus profond, 3x12',d:"Descends un peu plus bas si la semaine 1 était indolore. Un seul paramètre à la fois."},

<script>
/* ---- montage Tindeq (traction au sol) ---- */
const TINDEQ_SETUP={name:'Montage du Tindeq (à lire une fois, puis à refaire à l\'identique)',goal:"Tout ton programme de doigts passe par des tractions au sol : zéro suspension, charge mesurée au dixième de kilo, et le geste le plus sûr qui existe pour des doigts qui reviennent de blessure.",items:[
 {id:'s1',l:'Le montage',d:"Une sangle passée sous ton pied (ou sous les deux pieds, jambes tendues), le Tindeq accroché dessus par un mousqueton, et ta réglette 20 mm accrochée au Tindeq. Tu tires vers le haut avec une main. Le Tindeq lit exactement la force que tes doigts produisent."},
 {id:'s2',l:'La position, c\'est la moitié du travail',d:"Debout, buste légèrement penché en avant, bras presque tendu (coude à 150° environ, comme sur une suspension), épaule active : tu tires l'omoplate vers le bas et l'arrière, tu ne laisses pas l'épaule remonter dans l'oreille. Le tirage vient des doigts et du dos, pas du biceps."},
 {id:'s3',l:'Toujours exactement la même position',d:"C'est la seule contrainte du protocole, mais elle est absolue. Quelques centimètres de différence sur la longueur de sangle changent ton chiffre de 10 %, et tes courbes ne veulent plus rien dire. Fais un repère au marqueur sur la sangle et prends une photo de ta position le premier jour."},
 {id:'s4',l:'Réglage de l\'app Tindeq',d:"Mode Repeaters, avec la force cible affichée à l'écran. Tu regardes la barre et tu tiens la ligne. C'est bien plus précis que d'accrocher des poids à un baudrier, et c'est le gros avantage de ta méthode par rapport à une poutre classique."},
 {id:'s5',l:'Monte en force en 2 secondes',d:"Jamais un à-coup sec sur les doigts. Tu montes progressivement pendant 2 s, tu tiens la valeur cible, et tu relâches progressivement. C'est ce qui rend la traction au sol plus sûre qu'une suspension."},
 {id:'s6',l:'Une main à la fois, toujours',d:"Tu alternes gauche et droite. Ça double le temps de séance mais ça règle ton asymétrie post-blessure, ce qu'une suspension à deux mains ne fera jamais."}
]};
const WU_MAISON={name:'Échauffement (15 min)',items:[
 {id:'wu1',l:'Cardio léger 5 min',d:"Corde à sauter légère, montées de genoux ou marche rapide. Objectif circulation, pas performance. Avec ton genou, évite les sauts si c'est un jour sensible : rameur ou vélo."},
 {id:'wu2',l:'Mobilité épaules et poignets 3 min',d:"Dislocations au bâton, cercles de poignets, et 2x8 scapular pull-ups suspendu à ta barre bras tendus."},
 {id:'wu3',l:'Élastique doigts 2x20',d:"Flexion puis extension complète. Toujours avant de charger les doigts, c'est ce qui amène du sang dans les poulies."},
 {id:'wu4',l:'Tractions Tindeq progressives, 4x8s',d:"Sur ton montage habituel : 30 %, 50 %, 65 % puis 75 % de ton MVC. 1 min de repos entre chaque, chaque main. À la maison l'échauffement doit être plus complet qu'en salle parce que tu passes directement sur du lourd sans blocs faciles avant."}
]};
const UPPER_PULL={name:'Renfo : tirage et gainage',items:[
 {id:'u1',l:'Tractions, 4 séries à 2 répétitions de l\'échec',d:"Tempo lent, 2 s à la montée, 2 s à la descente, prise pronation. Si tu dépasses 12 répétitions, ajoute un sac à dos chargé."},
 {id:'u2',l:'Front lever, progression tuck, 5x10s',d:"Suspendu, genoux à la poitrine, bassin en rétroversion, tu ramènes le corps à l'horizontale. Quand tu tiens 15 s proprement, tu déplies une jambe. Le meilleur gainage qui existe pour le dévers, et c'est exactement ce que demande un 8a sur Kilter."},
 {id:'u3',l:'Gainage hollow body, 3x30s',d:"Bas du dos plaqué au sol, épaules et jambes décollées. Si le dos décolle, tu replies les genoux."},
 {id:'u4',l:'Scapular pull-ups, 3x10',d:"Suspendu bras tendus, tu montes et descends les épaules sans plier les coudes. Prépare l'épaule aux gros mouvements et prévient les tendinites."}
]};
const UPPER_PREV={name:'Renfo : antagonistes et prévention',goal:"Le contrepoids de tout le travail de doigts. C'est ce que tout le monde saute et c'est ce qui coûte trois mois d'arrêt à tout le monde.",items:[
 {id:'p1',l:'Extensions poignets et doigts à l\'élastique, 3x20',d:"Élastique autour des doigts, tu ouvres la main en grand contre la résistance. Le seul exercice qui équilibre vraiment les fléchisseurs surchargés."},
 {id:'p2',l:'Rotateurs externes à l\'élastique, 3x15 par bras',d:"Coude au corps à 90°, tu ouvres l'avant-bras vers l'extérieur, lentement. Trois minutes qui t'économisent une épaule."},
 {id:'p3',l:'Pompes ou dips, 3x12',d:"Le poussé équilibre le tiré. Rien de sophistiqué, juste de la régularité."},
 {id:'p4',l:'Rotation externe d\'épaule chargée (cuban press), 2x12',d:"Avec un haltère de 10 kg si c'est trop lourd, prends-en un seul et allège. Mouvement lent."},
 {id:'p5',l:'Pronation-supination avant-bras, 3x15 par bras',d:"Un haltère tenu par une extrémité, coude au corps, tu tournes l'avant-bras d'un côté puis de l'autre. Prévention directe de l'épicondylite."}
]};

/* ---- doigts au Tindeq ---- */
function fingerBlock(w,day){
  const p=phaseOf(w).n;
  if(day===0){
    if(p===1){
      const pc=w===1?80:85;
      return {name:'Doigts : remise en charge lourde',goal:"Deux séances pour réveiller le système avant le bloc de force. Elle se fait à froid après échauffement, jamais après une séance de salle : si tu inverses, tu tires à 85 % de ce que tu vaux et tu gardes toute la fatigue.",items:[
        {id:'f1',l:`5 tractions de 10 s à ${pc} % du MVC, par main`,d:`Réglette 20 mm, demi-arqué strict. Environ {P${pc}}. Repos 3 min entre les séries, montre en main. Tu alternes gauche, droite, gauche, droite.`,tr:'kg',timer:'hang'},
        {id:'f2',l:'3 tractions de 10 s en prise ouverte à 65 %',d:"Environ {P65}. Première phalange dépliée, pas de pouce. Position beaucoup plus douce pour les poulies, et c'est celle qui domine sur les prises généreuses d'ouverture commerciale, donc exactement ce qui t'attend le 14 novembre.",tr:'kg'},
        {id:'f3',l:'Massage transverse de la cicatrice, 2 min',d:"Avant la séance, pas après. Pression ferme perpendiculaire à la poulie, sur une main chauffée. C'est du remodelage mécanique et c'est la seule chose qui fait vraiment reculer une cicatrice hypertrophiée."}
      ]};
    }
    if(p===2){
      const retest=(w===3);
      const pc=w===3?92:w===4?95:100;
      const ns=w===3?4:w===5?5:6;
      return {name:retest?'Doigts : retest et force maximale':'Doigts : force maximale',goal:"Le bloc court et décisif. Trois semaines, une séance lourde par semaine, aucune marge pour en rater une. C'est ici que se gagnent les kilos qui compteront sur les blocs 12 à 20 du circuit.",items:[
        retest?{id:'f0',l:'Retest MVC avant de charger',d:"Protocole identique aux mesures du 12 septembre, même position, même échauffement. Toutes les charges des semaines 3 à 5 se calculent sur ce chiffre. Sans ce retest tu sous-charges tout le bloc d'environ 10 %.",tr:'mvc'}:null,
        {id:'f1',l:`${ns} tractions de 7 s à ${pc} % du MVC, par main`,d:`Environ {P${pc}}. Repos 3 min. Tu cherches le pic, pas la tenue : si le chiffre chute de plus de 10 % entre la première et la dernière série, tu arrêtes la séance là.`,tr:'kg',timer:'hang'},
        w===5?{id:'f2',l:'Full crimp 20 mm, 2 tractions de 6 s à 75 %',d:"Environ {P75}, en toute fin de séance. C'est la position qui charge le plus ta poulie et qui tire le plus sur la cicatrice. Tu montes prudemment mais tu ne l'évites pas : c'est aussi celle qui sert sur les prises franches en fin de circuit.",tr:'kg'}:null,
        {id:'f3',l:'2 séries de plus côté faible',d:"Uniquement si ton écart entre mains dépassait 10 % aux mesures du 12. Sinon tu sautes cette ligne."},
        {id:'f4',l:'Règle de douleur',d:"Gêne au-dessus de 4/10 pendant l'effort, ou douleur qui persiste le lendemain matin, ou gonflement : tu redescends d'un palier. Une cicatrice qui chauffe pendant la séance et qui est calme le lendemain, c'est le signal normal du remodelage."}
      ].filter(Boolean)};
    }
    if(p===3){
      if(w===6) return {name:'Doigts : retest et vitesse de montée en force',goal:"Fin du bloc lourd. À partir d'ici les doigts passent en entretien et l'énergie part sur la salle et les simulations.",items:[
        {id:'f0',l:'Retest MVC 20 mm et 15 mm',d:"Le bilan du bloc de force. Compare avec le 12 septembre et avec la semaine 3. Entre 6 et 12 % de gain sur cinq semaines de charge est une bonne trajectoire.",tr:'mvc'},
        {id:'f1',l:'6 tractions explosives de 4 s, réglette 20 mm',d:"Tu tires le plus vite possible et tu regardes deux chiffres : le pic atteint et le temps mis pour arriver à 80 % de ta MVC. Cherche à descendre sous 500 ms. Repos 2 min. Sur un bloc de compétition tu as trois à quatre dixièmes de seconde pour charger une prise : ta MVC ne sert à rien si ton pic arrive en une seconde et demie.",tr:'kg'},
        {id:'f2',l:'Arrêt si le pic chute de 15 %',d:"Travail très neural, la fatigue arrive vite et sans prévenir. Six séries propres valent mieux que dix séries molles, et tu as une simulation samedi."}
      ]};
      return {name:'Doigts : entretien',goal:"Séance courte et lourde, juste de quoi ne rien perdre. Simulation samedi, la fraîcheur passe avant tout le reste.",items:[
        {id:'f1',l:'4 tractions de 7 s à 90 % du MVC, par main',d:"Environ {P90}. Repos 3 min. Vingt minutes en tout, échauffement compris. Si tu hésites entre faire cette séance et arriver frais samedi, tu la sautes.",tr:'kg',timer:'hang'},
        {id:'f2',l:'Massage de la cicatrice, 2 min',d:"On le garde jusqu'au bout, y compris la semaine de compétition."}
      ]};
    }
    return {name:'Doigts : activation',goal:"Plus aucun stimulus, uniquement du réveil neural. Charger lourd maintenant ne peut plus rien t'apporter avant le 14, ça ne peut que te coûter de la fraîcheur.",items:[
      {id:'f1',l:`3 tractions de 5 s à ${w===8?70:60} % du MVC, par main`,d:`Environ {P${w===8?70:60}}. Repos 2 min. Ça doit être facile et court : tu sors en te disant que tu aurais pu en faire beaucoup plus. C'est exactement le but.`,tr:'kg'},
      {id:'f2',l:'Élastique doigts et mobilité poignet',d:"Deux séries de vingt flexions-extensions. Ça amène du sang sans fatiguer."}
    ]};
  }
  /* mercredi : capacité et densité */
  if(p===1) return {name:'Doigts : densité et remodelage',goal:"La séance anti-cicatrice. Tension longue et modérée, c'est ce qui réaligne les fibres d'un cal hypertrophié. Elle reste au programme jusqu'à la fin, y compris la semaine de compétition.",items:[
    {id:'g1',l:`5 tractions de 25 s à ${w===1?50:55} % du MVC, par main`,d:`Environ {P${w===1?50:55}}, réglette 20 mm. Repos 2 min entre les séries, 3 min entre les mains. Tu règles ton seuil sur l'app Tindeq et tu maintiens la courbe dans une fenêtre étroite. C'est long, c'est ennuyeux, et c'est exactement le stimulus qui fait tourner le collagène.`,tr:'kg'},
    w===2?{id:'g2',l:'15 mm en prise ouverte, 4 tractions de 10 s à 70 %',d:"Environ {Q70}, calculé sur ta MVC 15 mm. Première exposition au petit réglet de ce cycle, en position ouverte uniquement.",tr:'kg'}:null,
    {id:'g3',l:'Prise ouverte ou demi-arqué, jamais full crimp',d:"Sur toute cette séance. On charge le tissu longtemps, on ne l'agresse pas."}
  ].filter(Boolean)};
  if(p===2){
    const q=w===3?80:w===4?85:90;
    return {name:'Doigts : réglette 15 mm',goal:"Le complément de ta séance lourde du lundi, sur le format de prise le plus exigeant que tu possèdes. C'est aussi ici que se construit la capacité à recharger une petite prise plusieurs fois de suite, ce qui est exactement le problème d'un circuit de vingt blocs sans repos.",items:[
      {id:'g1',l:`5 tractions de ${w===5?7:8} s à ${q} % de ta MVC 15 mm, par main`,d:`Environ {Q${q}}. Repos 3 min. En demi-arqué les semaines 3 et 5, en prise ouverte la semaine 4, pour couvrir les deux angles.`,tr:'kg',timer:'hang'},
      {id:'g2',l:'Densité 20 mm, 3 tractions de 25 s à 55 %',d:"Environ {P55}, en fin de séance. Ta dose d'entretien pour la cicatrice, tu ne la sautes pas même quand la séance principale s'est bien passée.",tr:'kg'},
      {id:'g3',l:'Repeaters si tu as encore du jus, 3 séries de 6 x (7 s / 3 s) à 60 %',d:"Optionnel, seulement si le lundi s'est bien passé. Environ {P60}. Vingt blocs enchaînés sans repos, c'est un test de répétabilité autant que de force.",timer:'rep'}
    ]};
  }
  if(p===3) return {name:'Doigts : densité seule',goal:"Semaine de simulation. Le mercredi devient un entretien tissulaire, rien de plus. Tout le reste part dans la journée de samedi.",items:[
    {id:'g1',l:'3 tractions de 25 s à 55 % du MVC, par main',d:"Environ {P55}. Repos 2 min. Quinze minutes en tout.",tr:'kg'},

   {id:'c1',l:`Marche rapide ${w<=8?35:40} min avec ${w<=8?2:3} portions en côte`,d:"La montée charge le quadriceps sans l'impact de la course. Descente en marche lente et contrôlée : c'est la descente qui réveille un SFP, jamais la montée."},
   {id:'c2',l:'Test de tolérance : 30 sautillements sur place',d:"Une fois par semaine seulement. Aucune douleur pendant et aucune douleur le lendemain : tu progresses. Sinon tu restes en marche une semaine de plus, sans état d'âme."},
   w===10?{id:'c3',l:'Feu vert pour courir : les 4 critères',d:"Tu ne passes en course qu'avec les quatre réunis : descendre un escalier sans douleur, 20 squats unilatéraux sans douleur, 30 sautillements indolores le jour même et le lendemain, aucune douleur en position assise prolongée. S'il en manque un seul, tu reportes de deux semaines. La course est secondaire dans ce programme, elle ne vaut pas le risque de tout casser."}:null

const SLAB_WHY={id:'sw',l:'Pourquoi la dalle passe en premier dans la séance',d:"Elle demande de la précision, et de la précision il n'y en a plus quand tu es fatigué. Elle se fait à froid juste après l'échauffement, avant les blocs limites. Elle ne coûte presque rien à tes doigts, c'est pour ça qu'elle s'ajoute au programme sans rien retirer au travail de force."};

function slabBlock(w){
  const p=phaseOf(w).n;
  if(p===1) return {name:'Dalle : faire confiance à ses pieds (20 min)',goal:"Ton point faible assumé, et paradoxalement celui qui progresse le plus vite : la dalle est de la technique de pied et de la confiance, pas de la force. L'adaptation est presque immédiate, contrairement aux doigts.",items:[
    SLAB_WHY,
    {id:'d1',l:'6 blocs de dalle faciles, pieds silencieux',d:"Du 5c au 6b. Aucun pied ne doit faire de bruit. Tu poses, tu charges progressivement, et tu ne quittes pas ton pied des yeux avant qu'il soit chargé. Le regard qui file vers la prise de main suivante avant que le pied soit posé est l'erreur numéro un.",tr:'n'},
    {id:'d2',l:'Glissement volontaire, à 50 cm du sol',d:"Sur une adhérence, tu charges de plus en plus fort jusqu'à ce que le pied parte. Trois ou quatre fois, sur des inclinaisons différentes. C'est bizarre à faire et c'est l'exercice qui change tout : tant que tu ne sais pas où est la limite réelle de ta gomme, tu la sous-estimes énormément et tu grimpes crispé."},
    {id:'d3',l:'Talons bas sur toutes les adhérences',d:"Baisser le talon augmente la surface de gomme en contact et la pression sur l'avant du chausson. C'est contre-intuitif, l'instinct dit de monter sur la pointe, et l'instinct a tort."},
    {id:'d4',l:'Désescalader chaque bloc réussi',d:"Immédiatement après l'avoir sorti. Descendre force à regarder ses pieds et à contrôler, et ça double ton temps de contact avec le style pour zéro fatigue supplémentaire."},
    SLAB_KNEE
  ]};
  if(p===2) return {name:'Dalle : précision et engagement (25 min)',goal:"Le défaut du grimpeur de dévers en dalle : tirer sur les bras, ce qui décolle le bassin du mur et fait glisser les pieds. Les deux exercices d'aujourd'hui enlèvent les bras du problème.",items:[
    SLAB_WHY,
    {id:'d1',l:'4 blocs de dalle en no-hands ou mains à plat',d:"Tu montes en posant seulement les paumes à plat sur le mur, sans jamais tirer sur une prise. Du 5c au 6a. C'est l'exercice qui apprend au corps que l'équilibre vient du bassin au-dessus du pied, pas de la traction.",tr:'n'},
    {id:'d2',l:'5 rock-overs sur pied haut, sans tirer',d:"Tu poses un pied très haut et tu te relèves dessus en poussant, bras quasi tendus. Des deux côtés. C'est le mouvement de dalle par excellence et celui que tu rates probablement systématiquement.",tr:'n'},
    {id:'d3',l:'3 blocs en pieds imposés',d:"Tu refais une dalle facile en t'interdisant la moitié des prises de pieds. Brutal pour la lecture, et ça t'oblige à utiliser du volume et de l'adhérence pure."},
    {id:'d4',l:'Filmer un bloc que tu rates',d:"Tu verras deux choses que tu ne sens pas : ton bassin trop loin du mur, et le moment où tu hésites. L'hésitation fait glisser, parce qu'un pied chargé longtemps sans bouger finit par partir.",tr:'txt'},
    SLAB_KNEE
  ]};
  if(p===3) return {name:'Dalle : lecture et engagement sous fatigue (25 min)',goal:"Tu sais maintenant tenir sur des pieds. Reste à le faire vite, du premier coup, et quand les avant-bras sont déjà entamés.",items:[
    SLAB_WHY,
    {id:'d1',l:'5 dalles jamais vues, un seul essai chacune',d:"Deux minutes de lecture depuis le sol, chrono, puis un essai. Tu ne repasses pas sur un raté aujourd'hui. Du 6a au 6c+ selon ce que ta salle propose.",tr:'n'},
    {id:'d2',l:'Nommer les trois pieds clés à voix haute avant de partir',d:"Si tu n'y arrives pas depuis le sol, ta lecture n'est pas finie et tu prends trente secondes de plus. En dalle la méthode est dans les pieds, pas dans les mains."},
    {id:'d3',l:'2 dalles en toute fin de séance, avant-bras cuits',d:"C'est là que la technique de pied se révèle vraiment : quand tu ne peux plus compenser en tirant.",tr:'n'},
    {id:'d4',l:'Taux de flash en dalle',d:"Le chiffre à suivre sur tout le cycle. Trois sur cinq en semaine 10, quatre sur cinq en semaine 16, c'est une trajectoire correcte.",tr:'n'},
    SLAB_KNEE
  ]};
  return {name:'Dalle : confiance (10 min)',goal:"Affûtage. Quatre dalles faciles pour garder la sensation, rien de plus.",items:[
    {id:'d1',l:'4 dalles faciles, 5c à 6a+',d:"Réussies du premier coup, sans exception. La semaine avant une compétition, tu ne veux collectionner que des sensations de réussite.",tr:'n'}
  ]};
}
