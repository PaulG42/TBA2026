/* ---- pince : bloc de fin de séance en salle, sur disques de fonte ---- */
const PINCH_FORM={id:'pf',l:'Les deux erreurs qui annulent la moitié du bénéfice',d:"Le pouce se pose à plat sur la face du disque, jamais crocheté par la pulpe : sinon tu travailles la flexion du pouce au lieu de son adduction, et c'est l'adduction qui te manque en escalade. Et tes quatre doigts ne doivent jamais accrocher le bord du disque : dès qu'ils trouvent une arête, tu tires en arqué et tu te racontes que tu fais de la pince."};
const PINCH_SAFE={id:'ps',l:'Montage et sécurité',d:"Deux disques face lisse contre face lisse, les faces plates vers l'extérieur. Tu soulèves à dix centimètres du sol, au-dessus d'un tapis ou d'un tas de disques, jamais au-dessus de tes pieds. Ça finit par tomber, c'est le principe de l'exercice, autant que ça tombe sur du mou. Les disques en fonte lisse sont plus durs que les bumpers en caoutchouc : ne compare pas des charges d'un type à l'autre."};
function pinchBlock(w){
  const p=phaseOf(w).n;
  const large=(w%2===0);
  const wl=large?"large, environ 6 à 7 cm : trois disques fins, ou deux disques épais":"étroite, environ 3 à 4 cm : deux disques fins";
  const alt="La force en pince est extrêmement spécifique à l'écartement : être fort sur trois centimètres ne dit rien de ce que tu vaux sur sept, et c'est sur le large que la plupart des grimpeurs s'effondrent. Tu alternes donc les largeurs d'une semaine à l'autre.";
  if(p===1) return {name:'Pince : apprentissage (10 min)',goal:"Ton point faible déclaré, et celui qui répond le plus vite : dans la plupart des cas la pince est faible simplement parce qu'elle n'a jamais été entraînée. Six à huit semaines de travail régulier donnent des gains visibles, ce qui n'a rien à voir avec la lenteur des adaptations en arqué. Ce mois-ci on installe la position, pas la charge.",items:[
    PINCH_FORM,
    {id:'p1',l:`4 tenues de 12 s par main, largeur ${wl}`,d:`Charge modérée : tu dois pouvoir tenir les 12 secondes sans que la prise glisse dans la dernière seconde. Repos 2 min. Note le poids total des disques. ${alt}`,tr:'kg'},
    PINCH_SAFE,
    {id:'p2',l:'Magnésie autorisée, mais pas trop',d:"Une pince qui tient uniquement grâce à la magnésie ne t'apprend rien sur ta force réelle. Mains sèches, un peu de magnésie, et si ça glisse tout de suite c'est que la charge est trop lourde."}
  ]};
  if(p===2) return {name:'Pince : montée en charge (12 min)',goal:"La position est acquise, on charge. La pince fatigue l'adducteur du pouce et pas les fléchisseurs des doigts, c'est pour ça qu'elle peut se placer en fin de séance sans compromettre le reste.",items:[
    {id:'p1',l:`5 tenues de 12 s par main, largeur ${wl}`,d:`Tu montes de 1 à 2,5 kg dès que tu tiens les cinq séries proprement. Repos 2 min. ${alt}`,tr:'kg'},
    {id:'p2',l:'Une main à la fois, toujours',d:"La pince à deux mains masque les asymétries, et en escalade tu pinces toujours d'une main. Compare tes deux côtés à chaque séance."},
    PINCH_FORM
  ]};
  if(p===3) return {name:'Pince : force et capacité (14 min)',goal:"Deux formats dans la même séance : du lourd et du long. En bloc, une pince se tient rarement une seconde, elle se tient le temps de déplacer l'autre main.",items:[
    {id:'p1',l:`4 tenues de 10 s lourdes, largeur ${wl}`,d:"La dernière seconde doit être difficile. Repos 2 min 30.",tr:'kg'},
    {id:'p2',l:'2 tenues longues de 25 s, charge allégée de 40 %',d:"Le format capacité. C'est celui qui transfère sur les mouvements où tu dois tenir une pince pendant que tu montes un pied.",tr:'kg'},
    {id:'p3',l:'Test : compare tes deux largeurs',d:"Une fois dans le bloc, mesure ton max sur étroit et sur large le même jour. Plus de 30 % d'écart, c'est ton large qu'il faut prioriser sur les huit semaines suivantes.",tr:'txt'}
  ]};
  return {name:'Pince : entretien (8 min)',goal:"Phase de projection, la priorité est ailleurs. Trois séries pour ne pas reperdre quatre mois de travail.",items:[
    {id:'p1',l:`3 tenues de 12 s par main, largeur ${wl}`,d:"Charge confortable, 80 % de ton max. Repos 2 min.",tr:'kg'}
  ]};
}

/* ---- mode stage : phase Kilter compressée, 4 séances, environ 4 h ---- */
const STAGE_WU={id:'su',l:"L'échauffement ne se coupe pas",d:"C'est la seule chose qui ne se négocie pas quand tu manques de temps. Une planche attaquée sur des doigts froids avec une cicatrice hypertrophiée, c'est le scénario de blessure numéro un, et une blessure en janvier coûte tout le cycle. Quand tu es serré, tu coupes le nombre d'essais, jamais les vingt premières minutes."};
function stageDay(w,d){
  const proj=w>=19;
  if(d===0) return {title:'Maison : doigts en entretien',dur:'40 min',type:'finger',blocks:[
    {name:WU_MAISON.name,items:WU_MAISON.items},
    {name:'Entretien',goal:"Quarante minutes, faisables un soir de semaine même chargé. À partir de janvier c'est la planche qui entraîne tes doigts, le Tindeq ne sert plus qu'à ne rien perdre et à continuer de travailler la cicatrice.",items:[
      {id:'s1',l:'Densité 20 mm, 3 tractions de 25 s à 55 %',d:"Environ {P55}. Repos 2 min. C'est ta dose anti-cicatrice, elle coûte presque rien en fatigue et c'est la dernière chose que tu dois abandonner.",tr:'kg'},
      {id:'s2',l:'4 tractions de 7 s à 90 %, par main',d:"Environ {P90}. Repos 3 min. Assez pour maintenir ta force maximale, pas assez pour compromettre la séance de planche du mercredi.",tr:'kg',timer:'hang'},
      {id:'s3',l:'Élastique doigts, 2 x 20',d:"Le contrepoids. Deux minutes, tu ne le sautes pas."},
      {id:'s4',l:'Si la semaine est vraiment ingérable',d:"Garde uniquement la densité et l'élastique, quinze minutes. C'est mieux que rien et de très loin."}
    ]},
    {name:KNEE_MAINT.t,goal:KNEE_MAINT.note,items:KNEE_MAINT.ex.map(e=>({...e}))}
  ]};
  if(d===2) return {title:proj?'Kilter : projet, séance 1':'Kilter : reprise de contact',dur:'85 min',type:'climb',blocks:[
    {name:WU_SALLE.name,goal:"",items:[STAGE_WU,...WU_SALLE.items]},
    proj?{name:'Projection',goal:"Première des deux séances hebdomadaires sur ton projet. Version courte : moins d'essais, mêmes repos longs. Réduire les repos pour gagner du temps est la fausse bonne idée classique, ça transforme une séance de projection en séance de fatigue.",items:[
      {id:'a1',l:'Projet 8a, 5 à 6 essais',d:"8 min de repos entre les essais, montre en main. Cinq essais bien récupérés valent mieux que dix essais entassés.",tr:'n'},
      {id:'a2',l:'Découper en sections plutôt qu\'en tentatives complètes',d:"Mouvements isolés, puis liaisons de deux ou trois, puis départ du bas. C'est encore plus vrai quand tu as peu de temps : huit tentatives depuis le départ ne résolvent jamais un crux."},
      {id:'a3',l:'Point haut atteint',d:"",tr:'txt'}
    ]}:{name:'Retrouver la planche',goal:"Nouvelle salle, nouvel accès Kilter. Deux semaines pour retrouver les codes avant d'attaquer le projet.",items:[
      {id:'a1',l:'Fixe ton angle définitivement',d:"Choisis-le maintenant et n'en bouge plus jusqu'à la fin du cycle. Changer d'angle rend ta progression illisible.",tr:'txt'},
      {id:'a2',l:'8 à 10 blocs entre 7a et 7b+',d:"Sous ton niveau max. Tu réhabitues tes doigts aux prises de la planche, qui n'ont rien à voir avec ce que tu as grimpé depuis septembre.",tr:'n'},
      {id:'a3',l:'Répéter chaque bloc réussi une deuxième fois',d:"Immédiatement. C'est le moyen le plus rapide de réencoder les méthodes propres à la planche, et le plus rentable quand tu as peu de séances."}
    ]}
  ]};
  if(d===3) return {title:'Mobilité et genou',dur:'20 min',type:'off',blocks:[
    {name:'Vingt minutes, où tu veux',goal:"Le seul créneau de la semaine qui n'a pas besoin de salle ni de matériel. Fais-le au bureau si besoin.",items:[]},
    {name:MOB_ECART.name,items:MOB_ECART.items},
    {name:KNEE_MOB.name,items:KNEE_MOB.items}
  ]};
  if(d===5) return {title:proj?'Kilter : projet, séance 2':'Kilter : volume sur planche',dur:'95 min',type:'climb',blocks:[
    {name:WU_SALLE.name,goal:"",items:[STAGE_WU,...WU_SALLE.items]},
    proj?{name:'Projection',goal:"La séance de la semaine, celle qui porte l'objectif. Elle est le samedi parce que c'est le seul jour où une période chargée d'audit ne peut pas te la voler.",items:[
      {id:'a1',l:'Projet 8a, 6 à 8 essais',d:"Même bloc que mercredi, 8 min de repos. Deux séances par semaine sur quatre semaines, ça fait huit sessions sur le même bloc : largement de quoi enchaîner si le choix était bon.",tr:'n'},
      {id:'a2',l:'Filmer chaque tentative',d:"Le meilleur outil gratuit pour débloquer un crux, surtout sur les pieds et le placement du bassin."},
      {id:'a3',l:'Un 7c+ pour finir',d:"Sur quatre semaines de projection, la motivation compte autant que la force."},
      {id:'a4',l:'Point haut atteint',d:"",tr:'txt'}
    ]}:{name:'Volume et repérage',goal:"Deuxième séance de reprise en main.",items:[
      {id:'a1',l:'10 à 12 blocs entre 6c+ et 7b',d:"Sur ton angle fixé mercredi. Fluidité, pas de projection.",tr:'n'},
      {id:'a2',l:'Repérer 3 candidats pour ton projet 8a',d:"Deux ou trois essais chacun, juste pour voir lequel te parle. Celui que tu prendras en semaine 19 est celui dont tu fais déjà quelques mouvements, pas le plus beau.",tr:'txt'}
    ]},
    pinchBlock(w),
    {name:'Dalle, si la nouvelle salle en a',goal:"",items:[
      {id:'d1',l:'3 dalles faciles en fin de séance, 10 min',d:"Pour ne pas reperdre les cinq mois de travail. C'est aussi la première chose à couper les semaines où tu es débordé, sans culpabilité.",tr:'n'}
    ]}
  ]};
  return {title:'Repos',dur:'',type:'off',sub:"Mode stage. Quatre séances par semaine, environ quatre heures : doigts le lundi, planche le mercredi et le samedi, mobilité le jeudi. Le reste est du repos, et c'est délibéré.",blocks:[
    {name:KNEE_MOB.name,items:KNEE_MOB.items}
  ]};
}

/* ---- séances salle : vendredi (difficulté) et dimanche (volume) ---- */
const LINKUP={id:'lk',l:'Link-ups : ton substitut au mur système',d:"Ta salle n'a ni spray wall ni planche, donc tu fabriques tes propres blocs durs : tu enchaînes deux blocs existants (le premier jusqu'au sommet, puis tu redescends en désescalade sur le second et tu le remontes), ou tu refais un bloc en t'interdisant deux prises de pieds. C'est la méthode classique pour créer de la difficulté quand l'ouverture ne suit pas, et c'est aussi ce qui te fera progresser en lecture."};

/* ---- mardi : troisième séance de salle, volume et capacité ---- */
const FLASH_SOURCES={id:'fs',l:"Où trouver des blocs que tu n'as jamais vus",d:"Tu as déjà fait 85 % de ta salle, donc la nouveauté se fabrique. Par ordre de priorité. Un, l'ouverture de la semaine : demande à l'accueil quel secteur rouvre et quel jour, et cale ta séance dessus, c'est gratuit et presque personne ne le fait. Deux, les blocs posés par ton binôme sur des prises existantes : il choisit départ, prises de mains et zone de pieds, il ne te dit rien, tu as un essai. C'est un bloc que tu n'as jamais vu, et c'est la meilleure source de toutes. Trois, les blocs connus mais modifiés : deux pieds interdits, une prise de main retirée, ou un départ déplacé. Quatre, les 15 % que tu n'as jamais faits, et ce n'est pas un hasard si tu les as évités : ce sont tes styles faibles, commence par ceux-là."};
const FLASH_RULE={id:'fr',l:"La règle, quelle que soit la source",d:"Lecture depuis le sol, un seul essai, et tu ne repasses jamais sur un raté le jour même. Si tu n'arrives pas à réunir le compte de blocs vraiment neufs, complète avec des blocs faits il y a plus de trois mois sans aller relire ta méthode : ce n'est pas parfait, mais un bloc oublié se lit presque comme un bloc neuf."};
const FOURXFOUR={id:'q0',l:'Le 4x4, mode d\'emploi',d:"Tu choisis 4 blocs nettement sous ton max, entre 6a et 6b+, que tu sors à coup sûr. Tu les enchaînes les quatre à la suite sans aucun repos, juste le temps de te déplacer et de brosser. Ça fait un tour. Puis 4 minutes de repos, et tu recommences, quatre tours en tout. Le dernier tour doit être moche : si tu finis frais, tes blocs sont trop faciles."};
function tuesSession(w){
  const p=phaseOf(w).n;
  if(p===1) return {title:'Salle : volume à vue et capacité',dur:'90 min',type:'climb',blocks:[
    {name:WU_SALLE.name,items:WU_SALLE.items},
    {name:'Volume à vue',goal:"Troisième séance de salle de la semaine, entièrement dédiée au nombre de blocs vus et à la capacité à enchaîner. Elle est légère pour les doigts et lourde pour le cardio, donc elle ne mange pas sur ta séance lourde du lundi.",items:[
      FLASH_SOURCES,FLASH_RULE,
      {id:'q1',l:'10 blocs neufs ou reconstruits, un seul essai chacun, 6b à 7a',d:"Si le secteur vient de rouvrir tu les prends tous là. Sinon, moitié blocs neufs, moitié blocs posés par ton binôme ou modifiés. Dix suffisent, mieux vaut dix vraiment inconnus que quinze dont tu connais la moitié.",tr:'n'},
      {id:'q2',l:'Taux de flash du jour',d:"Nombre sorti au premier essai, sur le nombre tenté. Note aussi la source, blocs neufs ou blocs posés par ton binôme, sinon tu compareras des choses différentes d'une semaine à l'autre.",tr:'n'}]},
    {name:'Capacité : 4x4',goal:"Le format qui répond directement au problème du TBA : tu ne tombes pas au bloc 12 parce que le bloc 12 est dur, tu tombes parce que tu as enchaîné onze blocs sans repos avant lui.",items:[
      FOURXFOUR,
      {id:'q3',l:'3 tours seulement cette semaine',d:"On installe le format. 4 min de repos entre les tours, montre en main.",tr:'n'}]},
    {name:MOB_ECART.name,items:MOB_ECART.items}
  ]};
  if(p===2) return {title:'Salle : capacité et densité d\'effort',dur:'100 min',type:'climb',blocks:[
    {name:WU_SALLE.name,items:WU_SALLE.items},
    {name:'Volume à vue',goal:"Même logique que la semaine précédente, avec un cran de difficulté en plus.",items:[
      FLASH_SOURCES,
      {id:'q1',l:'8 à 10 blocs neufs ou reconstruits, un essai chacun, 6c à 7b',d:"Plus dur que le mardi de phase 1, donc un taux de flash plus bas, c'est normal. Ne compare que des séances de même difficulté et de même source entre elles.",tr:'n'},
      {id:'q2',l:'Demande à ton binôme de t\'en poser 4 sur mesure',d:"Et précise-lui de viser tes points faibles : dalle, coordination, compression, sloper. Un binôme qui te pose des blocs confortables ne te sert à rien. Tu lui rends la pareille sur ses propres trous.",tr:'n'}]},
    {name:'Capacité : 4x4',goal:"Le cœur de la séance. Sur un circuit de vingt blocs enchaînés, la capacité à recharger les avant-bras après un bloc dur pèse autant que la force maximale.",items:[
      FOURXFOUR,
      {id:'q3',l:`4 tours, blocs entre 6a+ et 6c`,d:"4 min de repos entre les tours. Si tu finis les quatre tours proprement, tu montes d'un cran la difficulté des blocs la semaine suivante, pas le nombre de tours.",tr:'n'},
      {id:'q4',l:'Où tu craques dans le tour',d:"Deuxième bloc du troisième tour, quatrième bloc du dernier tour : note-le. C'est la même information que celle que tu chercheras pendant les simulations.",tr:'txt'}]},
    {name:'Une sortie hors de ta salle',goal:"",items:[
      {id:'q6',l:'Une séance dans une autre salle, une fois dans le bloc',d:"Sur les semaines 3 à 5, cale une séance dans une salle où tu n'as jamais grimpé, en remplacement d'un mardi. C'est ta seule vraie dose d'ouverture inconnue avant la simulation du 24 octobre, et ça vaut trois séances de blocs modifiés.",tr:'txt'}]},
    {name:'Coordination et volumes',goal:"",items:[
      {id:'q5',l:'6 blocs en coordination, volumes ou compression',d:"Du 6b au 6c+, en fin de séance. Ce sont les styles que Climbing District ouvre le plus et ceux qu'un grimpeur de dévers voit le moins.",tr:'n'}]},
    {name:MOB_ECART.name,items:MOB_ECART.items}
  ]};
  if(p===3) return {title:'Salle : entretien à vue',dur:'60 min',type:'climb',blocks:[
    {name:WU_SALLE.name,items:WU_SALLE.items},
    {name:'Court et facile',goal:"Semaine de simulation, la grosse journée est samedi. Le mardi devient une séance d'entretien, pas un troisième créneau d'entraînement.",items:[
      {id:'q1',l:'10 blocs à vue, 6b à 6c+',d:"Un essai chacun, sans acharnement. Tu entretiens la lecture rapide, tu ne crées pas de fatigue.",tr:'n'},
      {id:'q2',l:'Pas de 4x4 cette semaine',d:"La simulation de samedi est un 4x4 de cinq heures. Inutile d'en rajouter mardi."}]},
    {name:MOB_ECART.name,items:MOB_ECART.items}
  ]};
  return {title:'Mobilité',dur:'25 min',type:'mob',blocks:[
    {name:'Affûtage',goal:"Plus de troisième séance. À partir d'ici, chaque séance ajoutée te coûte de la fraîcheur sans rien te rapporter.",items:[]},
    {name:MOB_ECART.name,goal:"Ta priorité mobilité numéro un vu ta raideur.",items:MOB_ECART.items},
    {name:KNEE_MOB.name,items:KNEE_MOB.items}
  ]};
}

function climbSession(w,day){
  const p=phaseOf(w).n;
  const D=(t,g,items)=>({name:t,goal:g,items});
  if(day===5){ /* vendredi */
    if(p===1) return {title:'Salle : dalle, volume et largeur de styles',dur:'120 min',blocks:[WU_SALLE,slabBlock(w),
      D('Corps de séance',"Tu remets du mileage propre et tu rouvres les styles que le dévers ne travaille jamais. Deux séances par semaine seulement, donc chacune doit être complète.",[
      {id:'a1',l:'28 à 32 blocs entre 6b et 7a, à vue',d:"Repos court, 1 à 2 min. Le volume de mouvement est le but. Tu prends tous les secteurs de la salle, y compris ceux que tu évites d'habitude.",tr:'n'},
      {id:'a2',l:'Règle des pieds silencieux sur tous les blocs',d:"Aucun pied ne doit faire de bruit en se posant. Le meilleur exercice technique gratuit qui existe, et ça protège ton genou des à-coups."},
      {id:'a3',l:'3 blocs en 7a+ en fin de séance',d:"Juste pour toucher un peu de difficulté. Tu arrêtes avant l'échec répété."}])]};
    if(p===2&&w===CONTEST.w) return {title:'Salle : allégé, veille de contest',dur:'70 min',blocks:[WU_SALLE,slabBlock(w),
      D('Court et fluide',"Contest dimanche. Ta séance lourde de lundi était le vrai travail de la semaine, aujourd'hui tu bouges sans t'entraîner. La tentation sera de faire une vraie séance de flash, résiste : arriver frais dimanche vaut plus que douze blocs de plus vendredi.",[
      {id:'a1',l:'10 à 12 blocs faciles, 6a à 6c',d:"Zéro échec, zéro essai répété, aucun bloc limite.",tr:'n'},
      {id:'a2',l:'Repérer la logistique de dimanche',d:"Horaire, format, nombre de blocs, règles de comptage. Y aller sans savoir comment on marque des points est le meilleur moyen de gâcher les deux premiers tours.",tr:'txt'}])]};
    if(p===2) return {title:'Salle : dalle, flash et blocs limites',dur:'135 min',blocks:[WU_SALLE,slabBlock(w),
      D('Flash : la séance que tout le monde saute',"Ton taux de réussite au premier essai sur des blocs jamais vus est la donnée la plus prédictive de ta performance au TBA. Un bloc raté au premier essai en salle, c'est un bloc où tu es éliminé le 14 novembre.",[
      FLASH_SOURCES,
      {id:'a1',l:'8 blocs neufs ou reconstruits, un seul essai chacun, 6c à 7b',d:"Tu ne repasses jamais sur un bloc raté aujourd'hui. Lecture depuis le sol, un essai, puis au suivant. Le mardi a déjà mangé une partie du stock de nouveauté de la semaine, donc ici tu piocheras surtout dans les blocs posés par ton binôme et les blocs modifiés.",tr:'n'},
      {id:'a2',l:'Note ton taux de flash',d:"Sur le nombre tenté. C'est ta vraie métrique de progression pour la compétition, bien plus que les kilos au Tindeq.",tr:'n'},
      {id:'a3',l:'Lecture chronométrée à 3 minutes',d:"À partir de la semaine 4 : trois minutes de lecture maximum avant l'essai, chrono lancé. Au TBA tu liras pendant que l'équipe précédente grimpe, et tu n'auras pas plus."}]),
      D('Blocs limites',"Le complément de la séance lourde du lundi. Tu convertis la force en niveau réel.",[
      {id:'a4',l:'3 blocs à ta limite, 5 à 6 essais chacun',d:"Du 7b au 7c. 4 à 5 min de repos entre chaque essai, montre en main. Un essai fatigué ne sert à rien, il fait juste du dégât aux doigts.",tr:'n'},
      {id:'a5',l:'Genou : attention aux talons et drop knees appuyés',d:"Un talon crocheté à fond peut réveiller ton syndrome fémoro-patellaire. Tu peux les faire, tu charges progressivement, et tu notes la réaction le soir même.",tr:'txt'}])]};
    if(p===3) return {title:'Salle : entretien, veille de simulation',dur:'60 min',blocks:[WU_SALLE,slabBlock(w),
      D('Séance courte',"Simulation demain. Aujourd'hui tu bouges, tu ne t'entraînes pas. La tentation sera de faire une vraie séance, résiste.",[
      {id:'a1',l:'12 à 14 blocs faciles, 6a à 6c',d:"Du mouvement fluide, zéro échec, zéro essai répété. Tu sors de la salle en ayant l'impression de ne rien avoir fait.",tr:'n'},
      {id:'a2',l:'Répartir les styles avec ton binôme',d:"Décidez à l'avance qui attaque quoi : dalle technique, dévers puissant, coordination, compression. Cette décision doit être automatique demain, pas discutée pendant les quatre minutes.",tr:'txt'}])]};
    if(w===8) return {title:'Salle : flash léger',dur:'65 min',blocks:[WU_SALLE,slabBlock(w),
      D('Affûtage',"Le volume est divisé par deux et l'intensité plafonne. Tu entretiens la sensation de lecture rapide sans créer de fatigue.",[
      {id:'a1',l:'8 blocs, format flash, 6b à 7a',d:"Neufs si tu en as, sinon des blocs connus mais faciles. Cette semaine peu importe la nouveauté : tu veux repartir avec sept ou huit réussites, pas avec un projet en tête.",tr:'n'},
      {id:'a2',l:'Aucun bloc au-dessus de 7a, aucune exception',d:"Il n'y a plus rien à gagner et tout à perdre. Un doigt tiré cette semaine, c'est neuf semaines de préparation à la poubelle."}])]};
    return {title:'Repos total',dur:'',type:'off',blocks:[
      D('Veille de compétition',"Vendredi 13 novembre. Tu ne touches pas un mur, tu ne touches pas le Tindeq.",[
      {id:'a1',l:'Préparer le sac ce soir',d:"Chaussons, magnésie, brosse, deux t-shirts, tape, de quoi manger sur dix heures, une bouteille d'eau et une gourde de rechange. Le sac fait ce soir, c'est une chose de moins demain matin."},
      {id:'a2',l:'Relire la stratégie avec ton binôme',d:"Qui attaque quel style, comment vous vous parlez pendant les quatre minutes, à quel moment vous basculez. Dix minutes au téléphone suffisent."},
      {id:'a3',l:'Se coucher tôt',d:"Le sommeil de l'avant-veille compte autant que celui de la veille, mais celui de la veille ne se rattrape pas."}])]};
  }
  /* dimanche */
  if(p===1) return {title:'Salle : styles faibles et coordination',dur:'85 min',blocks:[WU_SALLE,
    D('Corps de séance',"Séance à faible charge pour les doigts et forte charge pour la tête. C'est ici que tu rattrapes ce que le dévers ne t'a jamais appris, et c'est exactement ce que les ouvreurs de Climbing District vont te servir.",[
    {id:'a1',l:'15 à 18 blocs, dont au moins 8 en dalle et vertical',d:"Du 6b au 7a. Volumes, slopers, coordination, appuis de pied douteux. Presque zéro charge pour tes poulies, donc tu peux en faire beaucoup.",tr:'n'},
    {id:'a2',l:'5 blocs en pieds imposés',d:"Tu refais un bloc facile en t'interdisant la moitié des prises de pieds. Exercice brutal pour la lecture et le placement du bassin."},
    {id:'a3',l:'6 blocs en dévers, faciles',d:"Pour ne pas perdre le contact avec le format qui te va bien."}])]};
  if(p===2){
    const nb=w===3?12:w===4?16:20;
    return {title:'Salle : circuit chronométré',dur:'90 min',blocks:[WU_SALLE,
    D('Circuit au format TBA',"La séance spécifique de la semaine. Elle reproduit la contrainte qui élimine les gens : l'absence totale de repos entre deux blocs validés.",[
    TBA_RULES,
    {id:'a1',l:`${nb} blocs enchaînés, 4 minutes chacun, difficulté croissante`,d:"Tu topes, tu descends, tu passes au bloc suivant. Aucune pause pour reprendre ton souffle, aucune discussion. C'est ce détail qui fait exploser les gens sur le douzième bloc alors qu'ils auraient sorti le dix-huitième à froid. Commence en 6b et finis sur le plus dur que tu tiennes.",tr:'n',timer:'bloc4'},
    {id:'a0',l:'Au moins 4 dalles dans le circuit, dont une dans les cinq derniers blocs',d:"Sinon tu vas composer un circuit de dévers, parce que c'est ce que tu aimes, et tu t'entraîneras à être bon là où tu l'es déjà. Une dalle en fin de circuit, avant-bras cuits et cardio en vrac, c'est le scénario exact du 14 novembre."},
    {id:'a2',l:'Où tu craques',d:"Note le numéro du bloc où ça part, et surtout pourquoi : avant-bras cuits, cardio, lecture trop lente, ou style qui ne passe pas. Les quatre problèmes ne se corrigent pas de la même façon.",tr:'txt'},
    {id:'a3',l:'Si tu finis le circuit, tu montes la difficulté de départ',d:"Pas le nombre de blocs. La difficulté croissante est ce qui reproduit le format, pas le volume brut."}]),
    D('Fin de séance',"",[
    {id:'a4',l:'6 blocs faciles en redescente',d:"Du 6a, pour finir en mouvement et évacuer."}])]};
  }
  if(p===3) return {title:'Salle : récupération active',dur:'45 min',type:'mob',blocks:[
    D('Lendemain de simulation',"Tu as vidé le réservoir hier. Aujourd'hui c'est du mouvement doux, ou rien du tout si tu es cassé.",[
    {id:'a1',l:'10 blocs faciles, 6a à 6b',d:"Ou une marche de 40 minutes si les avant-bras ne suivent pas. Les deux options se valent.",tr:'n'},
    {id:'a2',l:'Débrief de la simulation avec ton binôme',d:"À froid, mais pas trop tard. Trois questions : à quel bloc vous vous êtes arrêtés, quel style vous a coûté le plus cher, et quelle décision vous avez mis trop longtemps à prendre.",tr:'txt'},
    {id:'a3',l:'Étirements et mobilité 15 min',d:"Avant-bras, épaules, hanches. Plus le genou comme tous les jours."}])]};
  if(w===8) return {title:'Repos',dur:'',type:'off',blocks:[
    D('Affûtage',"Dimanche off complet. Une semaine avant la compétition, le repos est un entraînement.",[
    {id:'a1',l:'Mobilité douce si tu en as envie',d:"Douze minutes, pas plus. Si tu n'as pas envie, tu ne fais rien et c'est très bien."}])]};
  return {title:'Récupération post-TBA',dur:'40 min',type:'mob',blocks:[
    D('Le lendemain',"Dimanche 15 novembre. Marche, étirements, et tu notes tout pendant que c'est encore frais.",[
    {id:'a1',l:'Marche 40 min et étirements',d:"Rien d'autre. Les avant-bras et les doigts ont besoin de trois à quatre jours pleins après une journée pareille."},
    {id:'a2',l:'Bilan à chaud',d:"Combien de blocs, où vous vous êtes arrêtés, ce qui a marché, ce qui a manqué. Écris-le maintenant, dans deux semaines tu auras réécrit l'histoire.",tr:'txt'},
    {id:'a3',l:'Et après',d:"Le projet 8a sur Kilter revient sur la table en décembre, quand tu auras accès à la planche. La force construite cet automne ne se perd pas en deux semaines de coupure."}])]};
}
</script>
<script>
/* ============ ÉTAT ============ */
const KEY='projet8a.v1';
const DEF={start:'2026-09-14',bw:70,mvcL:0,mvcR:0,mvc15:0,kneeOffset:2,stage:false,stageFrom:17,tests:[],log:{},theme:'auto'};
let S=Object.assign({},DEF);
async function loadState(){
  try{const r=localStorage.getItem(KEY); if(r) S=Object.assign({},DEF,JSON.parse(r));}catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
function weekOf(d){const s=parse(S.start);const diff=Math.floor((d-s)/864e5);return Math.floor(diff/7)+1}
function dowOf(d){return (d.getDay()+6)%7}
function entry(k){return S.log[k]||(S.log[k]={done:{},vals:{},rpe:null,pain:null,note:'',fin:false})}
const fmtDate=d=>d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});

/* MVC helpers */
const mvcMax=()=>Math.max(S.mvcL||0,S.mvcR||0);
const daysToTBA=()=>Math.round((parse(TBA.d)-today())/864e5);
function pct(p){const m=mvcMax();return m?`<b class="mono">${(m*p/100).toFixed(1)} kg</b>`:`<b>${p} % du MVC</b> (fais le test de la semaine 1 pour avoir la valeur en kg)`}
function pct15(p){const m=S.mvc15||0;return m?`<b class="mono">${(m*p/100).toFixed(1)} kg</b>`:`<b>${p} % du MVC 15 mm</b> (renseigne-la dans les réglages)`}
const fillP=t=>t.replace(/\{P(\d+)\}/g,(_,p)=>pct(+p)).replace(/\{Q(\d+)\}/g,(_,p)=>pct15(+p));

/* ============ CONSTRUCTION DU JOUR ============ */
function kneeSession(w){
  if(w<1) return null;
  const rw=w+(S.kneeOffset||0);
  if(rw<=6) return KNEE_REEDUC[rw-1];
  if(rw<=12) return KNEE_RENFO[rw-7];
  return KNEE_MAINT;
}
function buildDay(w,d){
  if(w===0&&(d===5||d===6)) return baselineDay(d);
  if(w<1){const s=buildDay(1,d);s.preview=true;return s}
  if(w>NW) return {title:'Cycle terminé',dur:'',type:'off',sub:"Le TBA est passé. Refais le test Tindeq, compare avec les mesures du 12 septembre, et relance un cycle depuis les réglages. Le projet 8a sur Kilter revient sur la table dès que tu as accès à la planche.",blocks:[]};
  const kn=kneeSession(w), knDays=w<=12?[0,2,4]:[0,4];
  const addKnee=(bl)=>{
    if(kn&&knDays.includes(d)) bl.push({name:kn.t,goal:kn.note+' '+KNEE_RULES,items:kn.ex.map(e=>({...e}))});
    return bl;
  };
  let s;
  if(d===0){
    const bl=[{name:WU_MAISON.name,items:WU_MAISON.items}];
    if(w===1) bl.push(TINDEQ_SETUP);
    bl.push(fingerBlock(w,0),UPPER_PULL);
    s={title:'Maison : doigts lourds et tirage',dur:'75 min',type:'finger',blocks:bl};
    addKnee(s.blocks);
  } else if(isContestDay(w,d)){
    s=contestDay();
  } else if(isTbaDay(w,d)){
    s={title:'Team Boulder Arena 5',dur:'la journée',type:'climb',blocks:tbaDay().blocks};
  } else if(isSimDay(w,d)){
    const sim=simSession(w);
    s={title:sim.title,dur:sim.dur,type:'climb',blocks:sim.blocks};
    s.blocks.push(pinchBlock(w));
  } else if(d===2&&w===NW){
    s={title:'Salle : dernier contact',dur:'35 min',type:'climb',blocks:[
      {name:WU_SALLE.name,items:WU_SALLE.items.slice(0,4)},
      {name:'Cinq à huit blocs faciles',goal:"Mercredi 11 novembre. Trente minutes de mur, rien de plus. Tu entretiens la sensation de prise et de lecture, tu ne cherches strictement aucune difficulté.",items:[
        {id:'z1',l:'5 à 8 blocs entre 6a et 6c',d:"Fluide, aucun échec, aucun essai répété. Tu sors en te disant que tu aurais pu en faire trente. C'est le but.",tr:'n'},
        {id:'z2',l:'Toucher deux ou trois styles différents',d:"Une dalle, un dévers, un truc en volumes. Juste pour que rien ne soit une surprise samedi."},
        {id:'z3',l:'Zéro bloc au-dessus de 6c',d:"Il reste trois jours. Rien de ce que tu ferais aujourd'hui ne peut te rendre plus fort samedi."}
      ]}
    ]};
  } else if(d===2){
    s={title:'Maison : capacité et prévention',dur:'60 min',type:'finger',blocks:[
      {name:WU_MAISON.name,items:WU_MAISON.items},
      fingerBlock(w,2),
      UPPER_PREV
    ]};
    addKnee(s.blocks);
  } else if(d===4||d===6){
    const c=climbSession(w,d===4?5:7);
    s={title:c.title,dur:c.dur,type:'climb',blocks:c.blocks.map(b=>({name:b.name,goal:b.goal,items:b.items}))};
    s.blocks.push(pinchBlock(w));
    addKnee(s.blocks);
  } else if(d===1){
    s=tuesSession(w);
  } else if(d===3){
    s={title:'Marche active et mobilité',dur:'50 min',type:'run',blocks:[
      runBlock(w),
      {name:MOB_ECART.name,items:MOB_ECART.items},
      {name:KNEE_MOB.name,items:KNEE_MOB.items}
    ]};
  } else {
    s={title:'Repos',dur:'15 min',type:'off',sub:"Jour off complet, la veille de ta séance de Kilter. La progression se fait pendant la récupération, pas pendant la séance.",blocks:[
      {name:MOB_QUOT.name,goal:"Version optionnelle et douce. Si tu es cassé, tu ne fais rien du tout, c'est un choix parfaitement valable.",items:MOB_QUOT.items},
      {name:KNEE_MOB.name,goal:"Celle-ci par contre tu la fais tous les jours, y compris aujourd'hui. Elle ne fatigue rien et c'est elle qui règle ton SFP sur la durée.",items:KNEE_MOB.items}
    ]};
  }
  s.blocks.forEach((b,i)=>b.items.forEach((x,j)=>x.uid=`w${w}d${d}b${i}i${j}`));
  s.key=`w${w}d${d}`;
  return s;
}
function dayLabel(w,d){const s=buildDay(w,d);return s}

/* ============ RENDU ============ */
let tab='jour', cursor=today(), weekView=null;
const $=q=>document.querySelector(q);
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');

const ICONS={
 jour:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/><path d="M9 16l2 2 4-4"/></svg>',
 semaine:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19" cy="18" r="2"/></svg>',
 force:'<svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 5-8 4 5"/><path d="M3 21h18"/></svg>',
 reglages:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>'};
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

function renderNav(){
  $('#nav').innerHTML=['jour','semaine','force','reglages'].map(t=>
    `<button data-tab="${t}" class="${tab===t?'on':''}">${ICONS[t]}${t==='reglages'?'Réglages':t}</button>`).join('');
}
function renderHeader(){
  const w=weekOf(cursor),ph=phaseOf(Math.min(NW,Math.max(1,w)));
  const jt=daysToTBA();
  const cd=jt>0?`J-${jt}`:jt===0?"C'est aujourd'hui":'TBA passé';
  $('#hmeta').textContent = w>=1&&w<=NW ? `S${w} / ${NW} · Bloc ${ph.n} · ${cd}` : `Hors cycle · ${cd}`;
  $('#htrack').innerHTML=Array.from({length:NW},(_,i)=>{const n=i+1;
    return `<i class="${n<w?'p':''}${n===w?' cur':''}"></i>`}).join('');
}

function exHTML(x,e){
  const done=!!e.done[x.uid], open=OPEN.has(x.uid);
  let extra='';
  if(x.tr==='kg') extra=`<div class="inl"><input inputmode="decimal" placeholder="kg" data-v="${x.uid}" value="${esc(e.vals[x.uid]||'')}"><span class="unit">charge utilisée</span></div>`;
  if(x.tr==='n') extra=`<div class="inl"><input inputmode="numeric" placeholder="nb" data-v="${x.uid}" value="${esc(e.vals[x.uid]||'')}"><span class="unit">blocs / essais réussis</span></div>`;
  if(x.tr==='txt') extra=`<div class="inl"><input style="width:100%" placeholder="note" data-v="${x.uid}" value="${esc(e.vals[x.uid]||'')}"></div>`;
  if(x.tr==='mvc') extra=`<div class="inl"><input inputmode="decimal" placeholder="G kg" data-mvc="L" value="${S.mvcL||''}"><input inputmode="decimal" placeholder="D kg" data-mvc="R" value="${S.mvcR||''}"><button class="mini" data-savemvc="1">Enregistrer le test</button></div>`;
  if(x.tr==='m15') extra=`<div class="inl"><input inputmode="decimal" placeholder="kg" data-m15="1" value="${S.mvc15||''}"><span class="unit">MVC 15 mm, enregistrée dans les réglages</span></div>`;
  if(x.tr==='cf') extra=`<div class="inl"><input inputmode="decimal" placeholder="CF kg" data-v="${x.uid}" value="${esc(e.vals[x.uid]||'')}"><span class="unit">critical force</span></div>`;
  const tm=x.timer?`<button class="mini" data-timer="${x.timer}" style="margin-top:8px">Lancer le chrono</button>`:'';
  return `<div class="ex ${done?'done':''} ${open?'open':''}">
    <button class="chk" data-chk="${x.uid}" aria-label="Cocher">${CHECK}</button>
    <div class="exb">
      <button class="exl" data-open="${x.uid}">${esc(x.l)}</button>
      ${x.d?`<div class="exd">${fillP(esc(x.d))}</div>`:''}
      ${!open&&x.d?`<button class="exi" data-open="${x.uid}">Détails</button>`:''}
      ${extra}${tm}
    </div></div>`;
}
const OPEN=new Set();

function viewJour(){
  const w=weekOf(cursor),d=dowOf(cursor),s=buildDay(w,d),e=entry(s.key+'-'+iso(cursor));
  const ph=(w>=1&&w<=NW)?phaseOf(w):null;
  const tot=s.blocks.reduce((a,b)=>a+b.items.length,0);
  const nd=s.blocks.reduce((a,b)=>a+b.items.filter(x=>e.done[x.uid]).length,0);
  let h=`<div class="pill">
    <button data-go="-1">Hier</button><button data-go="0" class="on">${iso(cursor)===iso(today())?"Aujourd'hui":fmtDate(cursor)}</button><button data-go="1">Demain</button></div>`;
  if(ph) h+=`<div class="card phasebox"><h3>Bloc ${ph.n} · ${ph.name}</h3><p>${ph.goal}</p></div>`;
  if(s.preview) h+=`<div class="warnbox"><b>Avant-première</b>Le cycle démarre le ${parse(S.start).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}. Ce que tu vois est la séance correspondante de la semaine 1 : tu peux la parcourir, rien n'est comptabilisé. Change la date de début dans les réglages si tu veux commencer plus tôt.</div>`;
  else if(S.stage&&w>=(S.stageFrom||17)) h+=`<div class="warnbox"><b>Mode stage actif</b>Semaine compressée à 4 séances, environ 4 h. Les deux séances de planche sont les piliers : si quelque chose doit sauter dans la semaine, ce n'est jamais l'une des deux, et ce n'est jamais l'échauffement.</div>`;
  else if(isDeload(w)) h+=`<div class="warnbox"><b>Semaine d'affûtage</b>Volume divisé par deux, plus rien de lourd, aucun nouveau stimulus. Il n'y a plus rien à gagner et tout à perdre. La seule chose que tu construis cette semaine, c'est de la fraîcheur.</div>`;
  if(isContestDay(w,d)) h+=`<div class="warnbox"><b>Contest</b>Il remplace le circuit chronométré du dimanche. À 41 jours du TBA tu n'as rien à ménager : tu y vas à fond et tu ramènes des données.</div>`;
  if(isSimDay(w,d)) h+=`<div class="warnbox"><b>Simulation complète</b>Journée longue au format TBA, avec ton binôme. Les données que tu ramènes de cette journée valent plus que n'importe quelle séance de force du mois passé.</div>`;
  if(isTbaDay(w,d)) h+=`<div class="warnbox"><b>${TBA.name}</b>${TBA.lieu}. Plus rien à construire aujourd'hui, tout est déjà fait. Bonne compét.</div>`;
  else if(w>=1&&w<=NW){const jt=daysToTBA(); if(jt>0&&jt<=21) h+=`<div class="warnbox"><b>J-${jt} avant le TBA</b>${TBA.lieu}, samedi 14 novembre.</div>`;}
  h+=`<div class="card"><div class="shead">
      <div class="srow"><span class="tag acc"><i class="dot"></i>${DAYS[d]}</span>${s.dur?`<span class="tag mono">${s.dur}</span>`:''}<span class="tag ${nd===tot&&tot?'ok':''}">${nd}/${tot}</span></div>
      <div class="stitle">${esc(s.title)}</div>
      ${s.sub?`<p class="sgoal">${esc(s.sub)}</p>`:''}</div>`;
  s.blocks.forEach(b=>{
    h+=`<div class="blk"><div class="blkh"><span>${esc(b.name)}</span></div>`;
    if(b.goal) h+=`<p class="note" style="padding-top:2px">${esc(b.goal)}</p>`;
    h+=b.items.map(x=>exHTML(x,e)).join('')+`</div>`;
  });
  h+=`</div>`;
  if(tot){
    h+=`<div class="card pad">
      <label style="font-size:13px;font-weight:600">Ressenti de la séance (RPE) <b class="mono" id="rpev">${e.rpe??'-'}</b>/10</label>
      <input type="range" class="slider" min="1" max="10" value="${e.rpe||6}" id="rpe">
      <label style="font-size:13px;font-weight:600;display:block;margin-top:14px">Douleur doigts / genou <b class="mono" id="painv">${e.pain??'-'}</b>/10</label>
      <input type="range" class="slider" min="0" max="10" value="${e.pain||0}" id="pain">
      <p class="note" style="padding:8px 0 0">Doigts au-dessus de 2 : tu sautes la prochaine séance de poutre. Genou au-dessus de 4 : tu redescends d'une semaine sur le protocole.</p>
      <textarea id="note" placeholder="Notes libres : ce qui a marché, les blocs, les sensations" style="width:100%;min-height:70px;margin-top:8px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:14px">${esc(e.note||'')}</textarea>
      <button class="btn ${e.fin?'done':''}" id="fin">${e.fin?'Séance validée':'Valider la séance'}</button></div>`;
  }
  return h;
}
</script>
<script>
const TYPECOL={climb:'var(--accent)',finger:'var(--data2)',mob:'var(--data)',run:'var(--warn)',off:'var(--border)'};
function mondayOf(d){const x=new Date(d);x.setDate(x.getDate()-dowOf(x));x.setHours(0,0,0,0);return x}

function viewSemaine(){
  const base=weekView||mondayOf(cursor), w=weekOf(base);
  const ph=(w>=1&&w<=NW)?phaseOf(w):null;
  let h=`<div class="pill"><button data-wk="-1">Semaine précédente</button><button class="on">${w>=1&&w<=16?`Semaine ${w}`:'Hors cycle'}</button><button data-wk="1">Suivante</button></div>`;
  if(ph) h+=`<div class="card phasebox"><h3>Bloc ${ph.n} · ${ph.name}</h3><p>${ph.goal}</p></div>`;
  h+=`<div class="card">`;
  for(let i=0;i<7;i++){
    const dt=new Date(base);dt.setDate(dt.getDate()+i);
    const s=buildDay(weekOf(dt),i), k=s.key+'-'+iso(dt), e=S.log[k];
    const items=s.blocks.flatMap(b=>b.items);
    const tot=items.length;
    const nd=e?items.filter(x=>e.done[x.uid]).length:0;
    const isT=iso(dt)===iso(today());
    const wid='wk'+iso(dt);
    const wopen=OPEN.has(wid);
    h+=`<div class="day ${isT?'today':''}">
      <div class="stripe" style="background:${TYPECOL[s.type]}"></div>
      <div class="dnum"><b class="mono">${dt.getDate()}</b><s>${DSH[i]}</s></div>
      <div class="dbody">
        <button data-open="${wid}" style="text-align:left;width:100%">
          <b>${esc(s.title)}</b><span>${s.dur||'repos'}${tot?` · ${nd}/${tot}`:''}${e&&e.fin?' · validée':''}</span>
        </button>
        ${wopen&&tot?`<div style="margin-top:8px;display:flex;flex-direction:column;gap:5px">${items.map(x=>{
          const done=!!(e&&e.done[x.uid]);
          return `<button data-chk="${x.uid}" data-wkchk="${s.key}-${iso(dt)}" style="display:flex;align-items:center;gap:8px;text-align:left">
            <span class="chk" style="flex:0 0 18px;height:18px;${done?`background:var(--ok);border-color:var(--ok)`:''}">${done?`<svg viewBox="0 0 24 24" style="width:11px;height:11px;stroke:var(--surface);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>`:''}</span>
            <span style="font-size:13px;${done?'color:var(--dim);text-decoration:line-through':''}">${esc(x.l)}</span>
          </button>`}).join('')}</div>`:''}
        ${wopen&&!tot?`<div style="margin-top:6px;font-size:13px;color:var(--dim)">Journée de repos, rien de coché à faire.</div>`:''}
        <button data-day="${iso(dt)}" style="font-size:12px;color:var(--accent);font-weight:600;margin-top:6px">Ouvrir la séance complète</button>
      </div>
      ${e&&e.fin?'<span class="tag ok"><i class="dot"></i></span>':''}
    </div>`;
  }
  h+=`</div><p class="note" style="padding:12px 4px">Touche un jour pour voir les exercices, coche-les directement ici ou ouvre la séance complète pour les détails.</p>`;
  h+=`<h2>Structure de la semaine</h2><div class="card pad"><p class="sgoal" style="margin:0">
    Deux séances en salle seulement : vendredi pour la dalle puis la difficulté, dimanche pour le volume et le dévers. Le travail de pince se fait sur les disques de la salle, en fin des deux séances, dix à quinze minutes : il fatigue l'adducteur du pouce et pas les fléchisseurs, donc il ne compromet rien. Le bloc de dalle est toujours en tête de la séance du vendredi, à froid, parce que la précision disparaît avec la fatigue et qu'il ne coûte presque rien à tes doigts. Tout le travail de doigts se fait chez toi au Tindeq, lundi pour la force lourde et mercredi pour la capacité, sans jamais te suspendre. Les doigts passent toujours en premier dans la semaine et à froid, jamais après une séance de salle. Le renfo genou se greffe sur lundi, mercredi et vendredi comme ton kiné l'a prévu. Le mardi est une troisième séance de salle jusqu'à la semaine 5 : volume à vue et 4x4, léger pour les doigts et lourd pour le cardio, il ne mange donc pas sur la séance lourde du lundi. Il redevient de la mobilité pendant les semaines de simulation et d'affûtage. Le jeudi reste de la marche active, la course est sortie de ce cycle. Samedi est off, sauf les 24 et 31 octobre qui sont les deux simulations complètes, et le 14 novembre qui est la compétition.</p></div>`;
  return h;
}

/* ---- graphiques ---- */
function lineChart(id,series,labels){
  const c=document.getElementById(id); if(!c) return;
  const dpr=window.devicePixelRatio||1, W=c.clientWidth, H=190;
  c.width=W*dpr; c.height=H*dpr; c.style.height=H+'px';
  const x=c.getContext('2d'); x.scale(dpr,dpr);
  const cs=getComputedStyle(document.body);
  const col=n=>cs.getPropertyValue(n).trim();
  const all=series.flatMap(s=>s.pts).filter(v=>v!=null);
  if(!all.length){x.fillStyle=col('--faint');x.font='13px Archivo';x.textAlign='center';
    x.fillText('Pas encore de données',W/2,H/2);return}
  const mx=Math.max(...all)*1.12, mn=Math.min(0,Math.min(...all));
  const P={l:34,r:12,t:14,b:24}, iw=W-P.l-P.r, ih=H-P.t-P.b;
  const n=Math.max(2,labels.length);
  const px=i=>P.l+iw*(n===1?0.5:i/(n-1)), py=v=>P.t+ih-(v-mn)/(mx-mn)*ih;
  x.strokeStyle=col('--border');x.lineWidth=1;x.font='10px "JetBrains Mono"';x.fillStyle=col('--faint');
  for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=py(v);
    x.beginPath();x.moveTo(P.l,y);x.lineTo(W-P.r,y);x.stroke();
    x.textAlign='right';x.fillText(v.toFixed(0),P.l-6,y+3)}
  x.textAlign='center';labels.forEach((L,i)=>x.fillText(L,px(i),H-7));
  series.forEach(s=>{
    const pts=s.pts.map((v,i)=>v==null?null:[px(i),py(v)]).filter(Boolean);
    if(!pts.length)return;
    x.strokeStyle=col(s.c);x.lineWidth=2.2;x.lineJoin='round';x.beginPath();
    pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();
    pts.forEach((p,i)=>{x.fillStyle=col(s.c);x.beginPath();
      x.arc(p[0],p[1],i===pts.length-1?4.5:3,0,7);x.fill();
      if(i===pts.length-1){x.strokeStyle=col('--surface');x.lineWidth=2;x.stroke()}});
  });
}
function barChart(id,vals){
  const c=document.getElementById(id); if(!c) return;
  const dpr=window.devicePixelRatio||1,W=c.clientWidth,H=130;
  c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';
  const x=c.getContext('2d');x.scale(dpr,dpr);
  const cs=getComputedStyle(document.body),col=n=>cs.getPropertyValue(n).trim();
  const mx=Math.max(4,...vals), gap=3, bw=(W-gap*(NW-1))/NW, cw=weekOf(today());
  vals.forEach((v,i)=>{
    const h=Math.max(2,v/mx*(H-24)), X=i*(bw+gap), Y=H-18-h;
    x.fillStyle=i+1===cw?col('--accent'):v?col('--data'):col('--surface2');
    x.beginPath();x.roundRect(X,Y,bw,h,2.5);x.fill();
  });
  x.fillStyle=col('--faint');x.font='9px "JetBrains Mono"';x.textAlign='center';
  [1,3,5,7,9].forEach(n=>x.fillText('S'+n,(n-1)*(bw+gap)+bw/2,H-5));
}

function viewForce(){
  const tests=S.tests.slice().sort((a,b)=>a.w-b.w);
  const labels=tests.map(t=>'S'+t.w);
  const weeks=Array.from({length:NW},(_,i)=>{
    let n=0;Object.keys(S.log).forEach(k=>{const m=k.match(/^w(\d+)d\d+-/);if(m&&+m[1]===i+1&&S.log[k].fin)n++});return n});
  const doneTot=weeks.reduce((a,b)=>a+b,0);
  const cw=Math.min(NW,Math.max(0,weekOf(today())));
  const hangs=[];
  for(let w=1;w<=NW;w++){let best=0;Object.keys(S.log).forEach(k=>{const m=k.match(/^w(\d+)d0-/);
    if(m&&+m[1]===w)Object.values(S.log[k].vals||{}).forEach(v=>{const f=parseFloat(v);if(f>best&&f<300)best=f})});
    hangs.push(best||null)}
  const g=mvcMax();
  let h=`<div class="card"><div class="stats">
    <div class="stat"><b class="mono">${doneTot}</b><s>séances validées</s></div>
    <div class="stat"><b class="mono">${cw}</b><s>semaine en cours</s></div>
    <div class="stat"><b class="mono">${g?g.toFixed(0):'—'}</b><s>MVC max (kg)</s></div>
  </div></div>`;
  h+=`<h2>Force de doigts au Tindeq</h2><div class="card"><canvas id="c1"></canvas>
    <div class="legend"><span><i style="background:var(--accent)"></i>Main gauche</span>
    <span><i style="background:var(--data)"></i>Main droite</span>
    <span><i style="background:var(--data2)"></i>Critical force</span></div></div>
    <p class="note" style="padding:8px 4px">Mesures le 12 septembre, retests en semaine 3 et 6. Enregistre-les depuis la séance du jour ou depuis les réglages.</p>`;
  h+=`<h2>Charge max hangs</h2><div class="card"><canvas id="c2"></canvas>
    <div class="legend"><span><i style="background:var(--accent)"></i>Meilleure charge de la semaine (kg)</span></div></div>`;
  h+=`<h2>Assiduité sur ${NW} semaines</h2><div class="card" style="padding:14px 14px 4px"><canvas id="c3"></canvas></div>
    <p class="note" style="padding:8px 4px">Chaque barre est le nombre de séances validées dans la semaine. Vise 4 à 5. Une semaine à 2 de temps en temps n'a aucune importance, trois semaines de suite à 2 en ont beaucoup.</p>`;
  if(tests.length>1){
    const f=tests[0],l=tests[tests.length-1];
    const dg=f.L?((l.L-f.L)/f.L*100):0, dd=f.R?((l.R-f.R)/f.R*100):0;
    h+=`<div class="warnbox"><b>Progression depuis le premier test</b>Main gauche ${dg>=0?'+':''}${dg.toFixed(1)} %, main droite ${dd>=0?'+':''}${dd.toFixed(1)} %. Sur les cinq semaines de charge utile de ce cycle, entre 6 et 12 % est une bonne trajectoire. Au-delà de 18 %, c'est probablement que ta mesure de départ était sous-estimée par un placement approximatif.</div>`;
  }
  setTimeout(()=>{
    lineChart('c1',[{pts:tests.map(t=>t.L||null),c:'--accent'},{pts:tests.map(t=>t.R||null),c:'--data'},{pts:tests.map(t=>t.CF||null),c:'--data2'}],labels);
    lineChart('c2',[{pts:hangs,c:'--accent'}],Array.from({length:NW},(_,i)=>i%2===0?'S'+(i+1):''));
    barChart('c3',weeks);
  },10);
  return h;
}

function viewReglages(){
  const end=new Date(parse(S.start));end.setDate(end.getDate()+NW*7-1);
  return `<div class="card phasebox"><h3>${TBA.name}</h3><p>Samedi 14 novembre 2026 · ${TBA.lieu}<br>Mesures le 12 septembre, simulations les samedis 24 et 31 octobre.<br><b class="mono">J-${Math.max(0,daysToTBA())}</b></p></div>
  <h2>Programme</h2><div class="card">
    <div class="field"><div><label>Début du cycle</label><div class="sub">Lundi 14 septembre. Fin le ${end.toLocaleDateString('fr-FR')}, le lendemain de la compétition.</div></div>
      <input type="date" id="start" value="${S.start}"></div>
    <div class="field"><div><label>Poids de corps</label><div class="sub">Sert au calcul des pourcentages de suspension</div></div>
      <input inputmode="decimal" id="bw" value="${S.bw}"></div>
  </div>
  <h2>Tindeq</h2><div class="card">
    <div class="field"><div><label>MVC main gauche</label><div class="sub">kg, réglette 20 mm, demi-crimp</div></div><input inputmode="decimal" id="ml" value="${S.mvcL||''}"></div>
    <div class="field"><div><label>MVC réglette 15 mm</label><div class="sub">kg, meilleure des deux mains. Sert aux séances du mercredi.</div></div><input inputmode="decimal" id="m15" value="${S.mvc15||''}"></div>
    <div class="field"><div><label>MVC main droite</label><div class="sub">kg</div></div><input inputmode="decimal" id="mr" value="${S.mvcR||''}"></div>
    <div class="field"><div><label>Critical force</label><div class="sub">Moyenne des 6 dernières répétitions</div></div><input inputmode="decimal" id="mc" value=""></div>
    <div style="padding:0 16px 16px"><button class="btn" id="addtest">Enregistrer un test daté</button></div>
  </div>
  ${S.tests.length?`<div class="card"><div class="blkh"><span>Historique des tests</span></div>${S.tests.slice().sort((a,b)=>b.w-a.w).map(t=>
    `<div class="field"><div><label>Semaine ${t.w}</label><div class="sub">${t.d}</div></div>
     <div class="mono" style="font-size:13px;text-align:right">G ${t.L||'—'} · D ${t.R||'—'}<br>CF ${t.CF||'—'}</div></div>`).join('')}</div>`:''}
  <h2>Chronos rapides</h2><div class="card" style="padding:14px;display:flex;gap:8px;flex-wrap:wrap">
    <button class="mini" data-timer="bloc4">Bloc TBA 4 min</button>
    <button class="mini" data-timer="hang">Max hangs 5x10s</button>
    <button class="mini" data-timer="rep">Repeaters 6x6x(7/3)</button>
    <button class="mini" data-timer="cf">Critical force 24x(7/3)</button>
    <button class="mini" data-timer="rest3">Repos 3 min</button>
    <button class="mini" data-timer="rest5">Repos 5 min</button>
  </div>
  <h2>Apparence</h2><div class="card"><div class="field"><div><label>Thème</label><div class="sub">Suit ton iPhone par défaut</div></div>
    <select id="theme"><option value="auto"${S.theme==='auto'?' selected':''}>Auto</option><option value="light"${S.theme==='light'?' selected':''}>Clair</option><option value="dark"${S.theme==='dark'?' selected':''}>Sombre</option></select></div></div>
  <h2>Données</h2><div class="card pad">
    <p class="sgoal" style="margin:0 0 4px">Tout est stocké sur ton téléphone, rien ne part ailleurs. Exporte de temps en temps : si tu effaces les données de Safari, l'historique part avec.</p>
    <button class="btn ghost" id="exp">Exporter mes données</button>
    <button class="btn ghost" id="imp">Importer une sauvegarde</button>
    <button class="btn ghost" id="rst" style="color:var(--danger)">Tout effacer</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
  <h2>Installer sur l'iPhone</h2><div class="card pad"><p class="sgoal" style="margin:0">
    Ouvre cette page dans Safari, bouton Partager, puis « Sur l'écran d'accueil ». Elle s'ouvrira en plein écran comme une vraie app, avec ses données.</p></div>
  <div style="height:20px"></div>`;
}
</script>
<script>
/* ============ CHRONO ============ */
const TCFG={
 hang:{w:10,r:180,reps:5,label:'Max hangs'},
 rep:{w:7,r:3,reps:6,sets:6,sr:150,label:'Repeaters'},
 cf:{w:7,r:3,reps:24,label:'Critical force'},
 rest3:{r:180,reps:0,label:'Repos'},
 rest5:{r:300,reps:0,label:'Repos'},
 bloc4:{r:240,reps:0,label:'Bloc — 4 min'}
};
let TQ=[],TI=0,TT=0,TId=null,AC=null,WL=null;
function beep(f,ms){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
  o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.001,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.28,AC.currentTime+.01);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+ms/1000);
  o.start();o.stop(AC.currentTime+ms/1000+.02)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function buildQ(k){
  const c=TCFG[k],q=[];
  if(!c.reps){q.push({k:'rest',d:c.r,l:'Repos',s:''});return q}
  const sets=c.sets||1;
  for(let s=1;s<=sets;s++){
    for(let i=1;i<=c.reps;i++){
      q.push({k:'work',d:c.w,l:'Suspension',s:`${i}/${c.reps}${sets>1?` · série ${s}/${sets}`:''}`});
      if(i<c.reps||sets===1&&i<c.reps) q.push({k:'rest',d:c.r,l:'Repos',s:`${i}/${c.reps}`});
      else if(i<c.reps) q.push({k:'rest',d:c.r,l:'Repos',s:`${i}/${c.reps}`});
    }
    if(s<sets) q.push({k:'rest',d:c.sr,l:'Repos entre séries',s:`série ${s}/${sets} terminée`});
  }
  if(c.reps&&!c.sets){ // insérer repos entre suspensions pour max hangs / cf
  }
  return q;
}
function startTimer(k){
  const c=TCFG[k];TQ=[];
  if(!c.reps){TQ=[{k:'rest',d:c.r,l:'Repos',s:''}]}
  else{const sets=c.sets||1;
    for(let s=1;s<=sets;s++){
      for(let i=1;i<=c.reps;i++){
        TQ.push({k:'work',d:c.w,l:'Tire',s:`${i} / ${c.reps}${sets>1?`  ·  série ${s}/${sets}`:''}`});
        if(i<c.reps) TQ.push({k:'rest',d:c.r,l:'Repos',s:`${i} / ${c.reps}`});
      }
      if(s<sets) TQ.push({k:'rest',d:c.sr,l:'Repos entre séries',s:`série ${s} terminée`});
    }}
  TI=0;$('#timer').classList.add('on');
  if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>WL=w).catch(()=>{});
  step();
}
function step(){
  clearInterval(TId);
  if(TI>=TQ.length){stopTimer();beep(880,400);buzz([200,80,200]);return}
  const s=TQ[TI];TT=s.d;
  $('#timer').className='on '+s.k;
  $('#tphase').textContent=s.l;$('#tsub').textContent=s.s;
  paint();
  beep(s.k==='work'?880:520,140);buzz(s.k==='work'?[150]:[60]);
  TId=setInterval(()=>{
    TT--;paint();
    if(TT<=3&&TT>0){beep(660,70);buzz([40])}
    if(TT<=0){clearInterval(TId);TI++;step()}
  },1000);
}
function paint(){
  const s=TQ[TI];if(!s)return;
  const m=Math.floor(TT/60),sec=TT%60;
  $('#tbig').textContent=TT>=60?`${m}:${String(sec).padStart(2,'0')}`:String(TT).padStart(2,'0');
  const C=2*Math.PI*46,f=TT/s.d;
  const r=$('#tring');r.style.strokeDasharray=C;r.style.strokeDashoffset=C*(1-f);
}
function stopTimer(){clearInterval(TId);$('#timer').classList.remove('on');
  if(WL){try{WL.release()}catch(e){}WL=null}}

/* ============ RENDU PRINCIPAL ============ */
function render(){
  renderHeader();renderNav();
  $('#view').innerHTML = tab==='jour'?viewJour():tab==='semaine'?viewSemaine():tab==='force'?viewForce():viewReglages();
  window.scrollTo({top:0});
}
function applyTheme(){
  if(S.theme==='auto')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',S.theme);
}

/* ============ ÉVÉNEMENTS ============ */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-tab],[data-chk],[data-open],[data-go],[data-wk],[data-day],[data-timer],[data-savemvc],#fin,#exp,#imp,#rst,#addtest,#tskip,#tstop');
  if(!t)return;
  const k=weekOf(cursor)+'d'+dowOf(cursor);
  if(t.dataset.tab){tab=t.dataset.tab;render();return}
  if(t.dataset.chk){
    const e=t.dataset.wkchk?entry(t.dataset.wkchk):entry(buildDay(weekOf(cursor),dowOf(cursor)).key+'-'+iso(cursor));
    e.done[t.dataset.chk]=!e.done[t.dataset.chk];save();buzz([25]);render();return}
  if(t.dataset.open){const id=t.dataset.open;OPEN.has(id)?OPEN.delete(id):OPEN.add(id);render();return}
  if(t.dataset.go){const n=+t.dataset.go;if(n){cursor=new Date(cursor);cursor.setDate(cursor.getDate()+n)}else cursor=today();render();return}
  if(t.dataset.wk){weekView=mondayOf(weekView||cursor);weekView.setDate(weekView.getDate()+7*+t.dataset.wk);render();return}
  if(t.dataset.day){cursor=parse(t.dataset.day);tab='jour';render();return}
  if(t.dataset.timer){startTimer(t.dataset.timer);return}
  if(t.id==='tskip'){TI++;step();return}
  if(t.id==='tstop'){stopTimer();return}
  if(t.dataset.savemvc||t.id==='addtest'){
    const L=parseFloat((document.querySelector('[data-mvc="L"]')||document.getElementById('ml'))?.value)||0;
    const R=parseFloat((document.querySelector('[data-mvc="R"]')||document.getElementById('mr'))?.value)||0;
    const CF=parseFloat(document.getElementById('mc')?.value)||null;
    if(L)S.mvcL=L; if(R)S.mvcR=R;
    const w=Math.min(NW,Math.max(1,weekOf(today())));
    const ex=S.tests.find(x=>x.w===w);
    const rec={w,d:today().toLocaleDateString('fr-FR'),L:L||null,R:R||null,CF};
    if(ex)Object.assign(ex,rec);else S.tests.push(rec);
    save();render();return}
  if(t.id==='fin'){
    const s=buildDay(weekOf(cursor),dowOf(cursor)),e=entry(s.key+'-'+iso(cursor));
    e.fin=!e.fin;
    if(e.fin){s.blocks.forEach(b=>b.items.forEach(x=>{if(e.done[x.uid]===undefined)e.done[x.uid]=true}))}
    save();buzz([40,60,40]);render();return}
  if(t.id==='exp'){exportData();return}
  if(t.id==='imp'){document.getElementById('file').click();return}
  if(t.id==='rst'){if(confirm('Tout effacer ? Historique, tests, séances. Irréversible.')){S=Object.assign({},DEF);save();render()}return}
});
document.addEventListener('input',ev=>{
  const el=ev.target;
  if(el.dataset.v){const s=buildDay(weekOf(cursor),dowOf(cursor)),e=entry(s.key+'-'+iso(cursor));
    e.vals[el.dataset.v]=el.value;save();return}
  if(el.id==='rpe'){const s=buildDay(weekOf(cursor),dowOf(cursor));entry(s.key+'-'+iso(cursor)).rpe=+el.value;
    document.getElementById('rpev').textContent=el.value;save();return}
  if(el.id==='pain'){const s=buildDay(weekOf(cursor),dowOf(cursor));entry(s.key+'-'+iso(cursor)).pain=+el.value;
    document.getElementById('painv').textContent=el.value;save();return}
  if(el.id==='note'){const s=buildDay(weekOf(cursor),dowOf(cursor));entry(s.key+'-'+iso(cursor)).note=el.value;save();return}
  if(el.id==='bw'){S.bw=parseFloat(el.value)||0;save();return}
  if(el.id==='ml'){S.mvcL=parseFloat(el.value)||0;save();return}
  if(el.id==='mr'){S.mvcR=parseFloat(el.value)||0;save();return}
  if(el.id==='m15'||el.dataset.m15){S.mvc15=parseFloat(el.value)||0;save();return}
  if(el.id==='sfrom'){S.stageFrom=Math.max(1,Math.min(NW,parseInt(el.value)||17));save();render();return}
  if(el.id==='koff'){S.kneeOffset=Math.max(0,Math.min(11,parseInt(el.value)||0));save();return}
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='start'){const v=ev.target.value;if(v){const d=parse(v);
    if(dowOf(d)!==0)alert("Choisis un lundi, le programme est calé sur des semaines qui commencent le lundi.");
    S.start=v;save();render()}return}
  if(ev.target.id==='stage'){S.stage=ev.target.value==='1';save();render();return}
  if(ev.target.id==='theme'){S.theme=ev.target.value;save();applyTheme();render();return}
  if(ev.target.id==='file'){const f=ev.target.files[0];if(!f)return;
    const rd=new FileReader();rd.onload=()=>{try{S=Object.assign({},DEF,JSON.parse(rd.result));save();applyTheme();render();alert('Sauvegarde importée.')}
    catch(e){alert("Fichier illisible. Choisis un export généré par l'app.")}};rd.readAsText(f);return}
});
async function exportData(){
  const data=JSON.stringify(S,null,2);
  const name=`projet8a-${iso(today())}.json`;
  try{const dl=await claude.use('downloads');
    if(dl){await dl.save({filename:name,data});return}}catch(e){}
  try{const b=new Blob([data],{type:'application/json'}),u=URL.createObjectURL(b);
    const a=document.createElement('a');a.href=u;a.download=name;a.click();
    setTimeout(()=>URL.revokeObjectURL(u),2000)}
  catch(e){prompt('Copie ce texte et garde-le en lieu sûr',data)}
}
window.addEventListener('resize',()=>{if(tab==='force')render()});
(async()=>{
  await loadState();
  applyTheme();
  render();
})();
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
</script>
